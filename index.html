<script type="text/plain" id="grammar-en">
%fiches-grammar 1
%id en-de
%version 1

# articles | Artikel: a/an, the, kein Artikel | A1 | pos:n, word:a, word:an, word:the
Englische Nomen haben **kein Genus** – es gibt nur **the** (bestimmt) und **a/an** (unbestimmt).
|^ a / an | the | kein Artikel |
| eines von vielen, zum ersten Mal genannt | bekannt, schon genannt, einzigartig | Allgemeines im Plural, Unzählbares |
| a book, an apple | the book on the table, the sun | Dogs are friendly. I like music. |
**an** steht vor einem gesprochenen Vokal: an hour, an umbrella – aber a university (ju-).
> I [v:have] a [m:dog]. The [m:dog] [v:is] [j:black]. || Ich habe einen Hund. Der Hund ist schwarz.
> [m:Children] [v:love] [m:chocolate]. || Kinder lieben Schokolade.
! Berufe bekommen a: She is a teacher (nicht: She is teacher).
! Ohne Artikel: go to school, at home, by bus, have breakfast.
→ plural

# plural | Plural und unregelmäßige Formen | A1 | word:man, word:woman, word:child, word:person, word:foot, word:tooth, word:mouse
Regel: **+s** (books). Nach s, sh, ch, x, o: **+es** (buses, boxes, tomatoes). Konsonant + y → **-ies** (city → cities). Viele auf -f/-fe → **-ves** (knife → knives).
|^ Singular | Plural |
| man / woman | men / women |
| child | children |
| person | people |
| foot / tooth | feet / teeth |
| mouse | mice |
| sheep / fish | sheep / fish |
> The [m:children] [v:are playing] in the [m:garden]. || Die Kinder spielen im Garten.
> Many [m:people] [v:live] in [m:cities]. || Viele Menschen leben in Städten.
! people ist Plural: People are nice (nicht: people is).
! Unzählbar, kein Plural: information, advice, furniture, news.
→ articles, someany

# present | Present simple oder continuous | A1 | pos:v, tense:pres, tense:prog
|^ present simple | present continuous |
| Gewohnheit, Tatsache, Plan nach Fahrplan | Handlung gerade jetzt, vorübergehend |
| always, usually, often, every day | now, at the moment, today, this week |
| I work, she works | I am working, she is working |
In der 3. Person Singular (he/she/it) bekommt das present simple ein **-s**: she works, he goes, it watches.
> I [v:drink] [m:coffee] every [m:morning]. || Ich trinke jeden Morgen Kaffee.
> [a:Look]! It [v:is raining]. || Schau! Es regnet.
> She [v:works] in a [m:bank], but [a:this] [m:week] she [v:is working] at [m:home]. || Sie arbeitet in einer Bank, aber diese Woche arbeitet sie zu Hause.
! Das -s nicht vergessen: he likes, she has, it goes.
! Verben wie know, like, want, need, believe stehen fast nie in der -ing-Form: I know (nicht: I am knowing).
→ past, do

# past | Past simple oder present perfect | A2 | tense:past, tense:perf, tense:pastperf
|^ past simple | present perfect |
| abgeschlossen, Zeitpunkt in der Vergangenheit | Bezug zur Gegenwart, Zeitpunkt egal oder offen |
| yesterday, last week, in 2010, ago | ever, never, already, yet, just, since, for |
| I went | I have gone |
Das **past perfect** (had + Partizip) steht für das, was vor einem anderen Ereignis in der Vergangenheit geschah.
> I [v:saw] the [m:film] [a:yesterday]. || Ich habe den Film gestern gesehen.
> I [v:have] [a:never] [v:been] to [m:Japan]. || Ich war noch nie in Japan.
> We [v:have lived] here for ten [m:years]. || Wir wohnen seit zehn Jahren hier.
! Deutsch „seit“ = since (Zeitpunkt) oder for (Zeitraum) – und dazu das present perfect: I have lived here since 2020 (nicht: I live here since 2020).
! Mit einer Zeitangabe der Vergangenheit kein present perfect: I went there last year (nicht: I have gone there last year).
→ irregular, present

# irregular | Die wichtigsten unregelmäßigen Verben | A1 | word:be, word:have, word:go, word:do, word:get, word:make
Regelmäßige Verben bilden Vergangenheit und Partizip mit **-ed**. Die häufigsten Verben sind aber unregelmäßig – die Konjugationstabelle auf der Karte zeigt sie dir.
|^ Infinitiv | past simple | Partizip |
| be | was / were | been |
| have | had | had |
| go | went | gone |
| do | did | done |
| get | got | got |
| make | made | made |
| say | said | said |
| take | took | taken |
| come | came | come |
| see | saw | seen |
> She [v:went] to [m:London] and [v:saw] the [m:Queen's] [m:palace]. || Sie fuhr nach London und sah den Palast der Königin.
! Regelmäßig: Konsonant verdoppeln nach kurzem betontem Vokal: stop → stopped, plan → planned.
→ past

# do | Fragen und Verneinung mit do / does / did | A1 | word:do, word:not
Fragen und Verneinungen im present simple und past simple brauchen das Hilfsverb **do / does / did**. Das Hauptverb steht dann in der Grundform.
|^ | Frage | Verneinung |
| present | Do you like it? / Does she like it? | I don't like it. / She doesn't like it. |
| past | Did you see him? | I didn't see him. |
Ohne do kommen aus: be, have got und die Modalverben (can, must, will …): Are you tired? I can't swim.
> [v:Do] you [v:speak] [m:English]? || Sprichst du Englisch?
> She [v:doesn't] [v:eat] [m:meat]. || Sie isst kein Fleisch.
> [v:Did] you [v:sleep] [a:well]? || Hast du gut geschlafen?
! Nur einmal markieren: Does she like it? (nicht: Does she likes it?), I didn't go (nicht: I didn't went).
→ present

# future | will oder going to | A2 | tense:fut, word:will
|^ will | going to |
| spontane Entscheidung, Versprechen | Plan, Absicht |
| Vermutung ohne sichtbaren Anlass | Vorhersage mit sichtbarem Anlass |
| I'll help you! | I'm going to visit my aunt. |
Feste Termine stehen oft im present continuous: I'm meeting Tom tomorrow.
> I'[v:ll call] you [a:later]. || Ich rufe dich später an.
> [a:Look] at those [m:clouds] – it [v:is going to rain]. || Schau dir die Wolken an – es wird regnen.
! Nach when, if, as soon as steht für die Zukunft das present simple: When I arrive, I'll call you (nicht: when I will arrive).
→ if

# someany | some/any, much/many | A1 | word:some, word:any, word:much, word:many, word:a lot of
|^ | zählbar (books) | unzählbar (water) |
| viele | many | much |
| wenige | few | little |
| viel (allgemein, positive Sätze) | a lot of | a lot of |
**some** steht in positiven Sätzen und in Angeboten/Bitten, **any** in Fragen und Verneinungen.
> I [v:need] some [m:milk]. || Ich brauche Milch.
> [v:Do] you [v:have] any [m:questions]? || Habt ihr Fragen?
> There [v:aren't] many [m:people] here. || Hier sind nicht viele Leute.
! In Angeboten some: Would you like some tea?
! much klingt in positiven Sätzen steif: I drink a lot of coffee (statt: I drink much coffee).
→ plural

# comparison | Steigerung | A1 | pos:adj
|^ | Komparativ | Superlativ |
| kurze Adjektive (1 Silbe, -y) | -er: cheaper, happier | the -est: the cheapest, the happiest |
| lange Adjektive (2+ Silben) | more: more expensive | the most: the most expensive |
| unregelmäßig | better, worse, further | the best, the worst, the furthest |
Vergleiche mit **than** (als) und **as … as** (so … wie).
> My [m:car] [v:is] [j:older] than [o:yours]. || Mein Auto ist älter als deins.
> This [v:is] the [j:most beautiful] [m:beach] I [v:know]. || Das ist der schönste Strand, den ich kenne.
> He [v:is] as [j:tall] as his [m:father]. || Er ist so groß wie sein Vater.
! than, nicht then: bigger than me.
! Doppelt gemoppelt ist falsch: more bigger → bigger.
→ adverbs

# prepositions | Präpositionen der Zeit: in, on, at | A1 | word:in, word:on, word:at
|^ at | on | in |
| Uhrzeit: at 7 o'clock | Tage: on Monday | Monate, Jahre: in May, in 2020 |
| at night, at the weekend (BrE) | Datum: on 3 May | Jahreszeiten: in winter |
| at Christmas | on my birthday | Tageszeiten: in the morning |
Kein in/on/at vor next, last, this, every: I'll see you next week.
> The [m:film] [v:starts] at eight. || Der Film beginnt um acht.
> We [v:met] on a [m:Sunday] in [m:July]. || Wir haben uns an einem Sonntag im Juli getroffen.
! in the morning – aber: on Monday morning.
! Deutsch „in einer Woche“ (ab jetzt) = in a week, „in der Woche“ (unter der Woche) = during the week.

# if | Bedingungssätze mit if | A2 | word:if, tense:cond
Nach **if** steht **nie will und nie would**. Es gibt vier Typen:
|^ | if-Satz | Hauptsatz |
| zero: allgemeine Wahrheit (A2) | present | present |
| first: real, möglich (A2) | present | will |
| second: irreal, Gegenwart (B1) | past | would |
| third: irreal, Vergangenheit (B2) | past perfect | would have + Partizip |
> If you [v:heat] [m:ice], it [v:melts]. || Wenn man Eis erhitzt, schmilzt es.
> If I [v:have] [m:time], I [v:will come]. || Wenn ich Zeit habe, komme ich.
> If I [v:had] [m:time], I [v:would come]. || Wenn ich Zeit hätte, würde ich kommen.
> If I [v:had had] [m:time], I [v:would have come]. || Wenn ich Zeit gehabt hätte, wäre ich gekommen.
! Falsch: If I would have time … – nach if steht das past (had).
! Deutsch „wenn“: when = sobald, wann immer (es passiert sicher) – if = falls (vielleicht): When I get home, I'll call you. If I get home early, I'll call you.
! Bei be im second conditional oft were für alle Personen: If I were you …
→ future

# adverbs | Adverbien: -ly und Stellung | A2 | pos:adv
Adverbien der Art und Weise bildet man meist mit **-ly**: quick → quickly, careful → carefully, easy → easily. Ausnahmen: good → **well**, fast → fast, hard → hard.
Häufigkeitsadverbien (always, usually, often, sometimes, never) stehen **vor dem Hauptverb**, aber **nach be**.
> She [v:drives] [a:carefully]. || Sie fährt vorsichtig.
> I [a:usually] [v:get up] at seven. || Normalerweise stehe ich um sieben auf.
> He [v:is] [a:always] [j:late]. || Er kommt immer zu spät.
! Nach Verben wie look, feel, sound, taste steht das Adjektiv: It tastes good (nicht: well), You look tired.
! hardly heißt „kaum“, nicht „hart“: I hardly know him.
→ comparison

# phrasal | Phrasal verbs | A2 | phrasal
Phrasal verbs bestehen aus Verb + Partikel (up, down, out, off, on, after …). Die Bedeutung ist oft nicht aus den Teilen ableitbar: give up (aufgeben), look after (sich kümmern um), get on (zurechtkommen).
Bei trennbaren phrasal verbs kann das Objekt dazwischen stehen – ein **Pronomen muss** dazwischen: turn the light off / turn off the light – aber nur: turn **it** off.
> I [v:get] [p:up] at seven. || Ich stehe um sieben auf.
> She [v:looks] [p:after] her [m:brother]. || Sie kümmert sich um ihren Bruder.
> [v:Turn] [o:it] [p:off], [a:please]. || Mach es bitte aus.
! Falsch: turn off it. Richtig: turn it off.
! Lerne phrasal verbs immer mit einem Beispielsatz – die Karten in der App zeigen sie dir in Farbe.
→ present

  // a shared group: no longer marked as shared here (the words stay as a normal own group)

  // ---------- backup file: progress, own words, groups and settings of all courses (v71) ----------
  // { format: "fiches-backup", version: 1, created, courses: { "fr-de": { state, custom } … }, device: { ui, ai } }
  // import: merge (merge()/mergeCustom(), newer wins) or replace (local + account docs overwritten, safety copy in IndexedDB first)
  const BK_FORMAT = "fiches-backup", BK_VERSION = 1, BK_UNDO = "backup-undo";
  let BK = null;                                         // backup being imported
  function bkKeys(pair) {
    const p = pair.split("-"), lx = LXS[p[0]];
    return p[1] === "de" ? { ls: lx.ls, lsw: lx.lsw, dbp: lx.dbp } : { ls: "fiches-" + pair + "-v1", lsw: "fiches-" + pair + "-words-v1", dbp: pair + "-" };
  }
  function bkPairs() { return COURSES.map(function (c) { return c[0] + "-" + c[1]; }); }
  function bkClone(x) { return JSON.parse(JSON.stringify(x)); }
  function bkReadLS(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
  function bkLocal(pair) {
    if (pair === PAIR) return { state: bkClone(state), custom: bkClone(custom) };
    const k = bkKeys(pair);
    return { state: normalize(bkReadLS(k.ls)), custom: normCustom(bkReadLS(k.lsw)) };
  }
  function bkEmpty(c) { return !c.state.updated && !Object.keys(c.state.cards).length && !c.custom.words.length && !c.custom.groups.length; }
  async function bkCloud(pair) {
    if (!SYNC) return null;
    try {
      const dbp = bkKeys(pair).dbp, b = SYNC.base, db = SYNC.db;
      const refs = [db.doc(b + dbp + "srs"), db.doc(b + dbp + "words")];
      for (let i = 0; i < NSH; i++) refs.push(db.doc(b + dbp + "srs-c" + i));
      const sn = await Promise.all(refs.map(function (r) { return r.get(); }));
      const raw = sn[0].exists ? bkClone(sn[0].data()) : {};
      raw.cards = Object.assign({}, raw.cards || {});
      sn.slice(2).forEach(function (x) { if (x.exists) Object.assign(raw.cards, (x.data() || {}).cards || {}); });
      return { state: normalize(raw), custom: normCustom(sn[1].exists ? bkClone(sn[1].data()) : null) };
    } catch (e) { return null; }
  }
  async function bkWriteCloud(pair, st, cu) {
    if (sbOn()) { try { await sbPut("progress", st, pair); await sbPut("words", cu, pair); } catch (e) {} }
    if (!SYNC) return;
    const dbp = bkKeys(pair).dbp, b = SYNC.base, db = SYNC.db;
    const shards = []; for (let i = 0; i < NSH; i++) shards.push({ cards: {} });
    Object.keys(st.cards).forEach(function (id) { shards[shardOf(id)].cards[id] = st.cards[id]; });
    await db.doc(b + dbp + "srs").set(bkClone({ v: 2, updated: st.updated, meta: st.meta, settings: st.settings, shards: NSH }));
    for (let i = 0; i < NSH; i++) await db.doc(b + dbp + "srs-c" + i).set(bkClone(shards[i]));
    await db.doc(b + dbp + "words").set(bkClone(cu));
  }
  // the current data of every course (account copy merged in on claude.ai), plus device settings
  async function bkBuild() {
    const out = { format: BK_FORMAT, version: BK_VERSION, created: new Date().toISOString(), courses: {}, device: {} };
    const pairs = bkPairs();
    for (let i = 0; i < pairs.length; i++) {
      let c = bkLocal(pairs[i]);
      if (pairs[i] !== PAIR) { const r = await bkCloud(pairs[i]); if (r) c = { state: merge(c.state, r.state), custom: mergeCustom(c.custom, r.custom) }; }
      if (!bkEmpty(c)) out.courses[pairs[i]] = c;
    }
    const ui = bkReadLS(UI_KEY); if (ui) out.device.ui = ui;
    const ai = bkReadLS(LSAI); if (ai) { const a = bkClone(ai); delete a.keys; out.device.ai = a; }
    return out;
  }
  function bkSave(name, data) {
    if (AB) { try { AB.saveFile(name, data); return Promise.resolve(true); } catch (e) {} }
    if (downloadsNS) return downloadsNS.save({ filename: name, data: data }).then(function () { return true; }, function (e) { if (e && e.code === "declined") return false; throw e; });
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], { type: "application/json" })); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return Promise.resolve(true);
  }
  $("bk-export").addEventListener("click", async function () {
    const btn = this; btn.disabled = true;
    try {
      saveLocal(); saveCustomLocal();
      const b = await bkBuild();
      if (!Object.keys(b.courses).length) { toast(t("bk.empty")); return; }
      if (await bkSave("fiches-backup-" + today8() + ".json", JSON.stringify(b))) toast(t("bk.saved"));
    } catch (e) { toast(t("bk.err.export")); }
    finally { btn.disabled = false; }
  });
  // ---- import ----
  function bkParse(text) {
    let b; try { b = JSON.parse(String(text || "").replace(/^\uFEFF/, "")); } catch (e) { return { err: "bk.err.format" }; }
    if (!b || b.format !== BK_FORMAT || typeof b.courses !== "object" || !b.courses) return { err: "bk.err.format" };
    if (+b.version > BK_VERSION) return { err: "bk.err.version" };
    const courses = {};
    Object.keys(b.courses).forEach(function (p) {
      const c = b.courses[p];
      if (bkPairs().indexOf(p) < 0 || !c || typeof c !== "object") return;   // unknown course: ignored
      courses[p] = { state: normalize(c.state), custom: normCustom(c.custom) };
    });
    const dev = b.device && typeof b.device === "object" ? b.device : {};
    return { created: b.created, courses: courses, ui: dev.ui && typeof dev.ui === "object" ? dev.ui : null, ai: dev.ai && typeof dev.ai === "object" ? dev.ai : null };
  }
  function bkCounts(c) {
    const fmt = function (n) { return n.toLocaleString(NATIVE); };
    return t("bk.counts", {
      cards: fmt(Object.keys(c.state.cards).length),
      words: fmt(c.custom.words.filter(function (w) { return !w.base && !w.deleted; }).length),
      groups: fmt(c.custom.groups.filter(function (g) { return !g.base && !g.deleted; }).length),
      edited: fmt(c.custom.words.filter(function (w) { return w.base && !w.deleted && !w.restored; }).length)
    });
  }
  function bkDate(x) { const d = new Date(x); return isNaN(d) ? "?" : d.toLocaleString(NATIVE, { dateStyle: "medium", timeStyle: "short" }); }
  function bkCourseName(p) { const q = p.split("-"); return pairName(q[0], q[1]); }
  function bkShow(b) {
    BK = b;
    const pairs = Object.keys(b.courses);
    $("bk-prev").innerHTML = '<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>' + esc(t("bk.from", { date: bkDate(b.created) })) + "</b>" + ibtn("x", 'id="bk-close"', t("bk.close")) + "</div>" +
      pairs.map(function (p) {
        return '<div class="bk-c"><label><input type="checkbox" data-bkc="' + esc(p) + '" checked> <b>' + esc(bkCourseName(p)) + "</b></label>" +
          "<small>" + esc(t("bk.inFile", { c: bkCounts(b.courses[p]) })) + "</small><small>" + esc(t("bk.onDevice", { c: bkCounts(bkLocal(p)) })) + "</small></div>";
      }).join("") +
      (b.ui ? '<label><input type="checkbox" id="bk-ui" checked> <span>' + esc(t("bk.ui")) + "</span></label>" : "") +
      (b.ai ? '<label><input type="checkbox" id="bk-ai" checked> <span>' + esc(t("bk.ai")) + "</span></label>" : "") +
      '<p class="hint">' + esc(t("bk.how")) + "</p>" +
      '<div class="row"><button class="btn small" type="button" id="bk-merge">' + esc(t("bk.merge")) + '</button><button class="btn small ghost" type="button" id="bk-replace">' + esc(t("bk.replace")) + "</button></div>";
    $("bk-prev").hidden = false;
    try { $("bk-prev").scrollIntoView({ block: "nearest" }); } catch (e) {}
  }
  function bkClose() { BK = null; $("bk-prev").hidden = true; $("bk-prev").innerHTML = ""; }
  function bkChoice() {
    const pairs = Array.prototype.map.call(document.querySelectorAll("[data-bkc]:checked"), function (x) { return x.dataset.bkc; });
    return { pairs: pairs, ui: !!($("bk-ui") && $("bk-ui").checked), ai: !!($("bk-ai") && $("bk-ai").checked) };
  }
  function bkApplyDevice(b, ch) {
    try {
      if (ch.ui && b.ui) localStorage.setItem(UI_KEY, JSON.stringify(b.ui));
      if (ch.ai && b.ai) { const cur = bkReadLS(LSAI) || {}; const a = bkClone(b.ai); a.keys = cur.keys; localStorage.setItem(LSAI, JSON.stringify(a)); }
    } catch (e) {}
  }
  function bkRestart(msg) { toast(msg); setTimeout(function () { try { location.reload(); } catch (e) {} }, 900); }
  async function bkMerge(b, ch) {
    ch.pairs.forEach(function (p) {
      const f = b.courses[p], k = bkKeys(p);
      if (p === PAIR) {
        state = merge(state, f.state); custom = mergeCustom(custom, f.custom); saveLocal(); saveCustomLocal();
      } else {
        const l = bkLocal(p);
        try { localStorage.setItem(k.ls, JSON.stringify(merge(l.state, f.state))); localStorage.setItem(k.lsw, JSON.stringify(mergeCustom(l.custom, f.custom))); } catch (e) {}
      }
    });
    bkApplyDevice(b, ch);
    // the active course goes to the account now; other courses are merged with the account when they are opened
    if (ch.pairs.indexOf(PAIR) >= 0) { await Promise.race([Promise.all([flushSrs(), wordsWriter.flush()]), new Promise(function (r) { setTimeout(r, 4000); })]); }
    bkRestart(t("bk.done.merge"));
  }
  async function bkReplace(b, ch, isUndo) {
    // safety copy of everything as it is now
    const cur = await bkBuild();
    const saved = await idbPut({ id: BK_UNDO, text: JSON.stringify(cur), at: Date.now() });
    if (saved === null) { toast(t("bk.err.undo")); return; }
    // stop the regular writers so they cannot write the old data back
    srsRefs = null; wordsWriter.setRef(null); clearTimeout(srsTimer);
    for (let i = 0; i < ch.pairs.length; i++) {
      const p = ch.pairs[i], f = b.courses[p], k = bkKeys(p);
      const st = f.state, cu = f.custom;
      st.updated = Date.now(); cu.updated = Date.now();
      // account first: if that fails, the local data of this course stays as it was
      try { await bkWriteCloud(p, st, cu); } catch (e) { toast(t("bk.err.cloud", { course: bkCourseName(p) })); setTimeout(function () { try { location.reload(); } catch (x) {} }, 2500); return; }
      if (p === PAIR) { state = st; custom = cu; }
      try { localStorage.setItem(k.ls, JSON.stringify(st)); localStorage.setItem(k.lsw, JSON.stringify(cu)); } catch (e) {}
    }
    bkApplyDevice(b, ch);
    bkRestart(t("bk.done.replace"));
  }
  $("bk-prev").addEventListener("click", function (e) {
    if (e.target.closest("#bk-close")) { bkClose(); return; }
    const m = e.target.closest("#bk-merge"), r = e.target.closest("#bk-replace");
    if (!m && !r || !BK) return;
    const b = BK, ch = bkChoice();
    if (!ch.pairs.length && !ch.ui && !ch.ai) { toast(t("bk.noneSel")); return; }
    if (m) { bkMerge(b, ch); return; }
    if (!ch.pairs.length) { bkApplyDevice(b, ch); bkRestart(t("bk.done.replace")); return; }
    askConfirm(t("bk.replaceQ"), t("bk.replaceText", { courses: ch.pairs.map(bkCourseName).join(", "), date: bkDate(b.created) }), t("bk.replace"), function () { bkReplace(b, ch); });
  });
  $("bk-import").addEventListener("click", function () { $("bk-file").click(); });
  $("bk-file").addEventListener("change", function () {
    const f = $("bk-file").files && $("bk-file").files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = function () {

      const b = bkParse(rd.result);
      if (b.err) { toast(t(b.err)); return; }
      if (!Object.keys(b.courses).length && !b.ui && !b.ai) { toast(t("bk.err.format")); return; }
      bkShow(b);
    };
    rd.onerror = function () { $("bk-file").value = ""; toast(t("bk.err.read")); };
    rd.readAsText(f, "utf-8");

      const o = JSON.parse(decodeURIComponent(escape(atob(txt))));
      const ok = function (a) { return Array.isArray(a) && a.length === 5 && a.every(hx); };
      if (!ok(o.l) || !ok(o.d)) throw new Error("bad");
      TH.l = o.l.map(hx); TH.d = o.d.map(hx); if (o.n) { TH.name = String(o.n).slice(0, 30); $("th-name").value = TH.name; }
      renderThemeEditor(); $("th-code-msg").textContent = t("th.imported");
    } catch (err) { $("th-code-msg").textContent = t("th.badCode"); }
  });
  $("th-save").addEventListener("click", function () {
    if (!TH) return;
    const name = ($("th-name").value || "").trim() || t("th.defName", { n: (UI.own || []).length + 1 });
    UI.own = UI.own || [];
    let o = TH.id ? ownTheme(TH.id) : null;
    if (!o) { o = { id: "c-" + Date.now().toString(36) }; UI.own.push(o); }
    o.name = name; o.l = TH.l.slice(); o.d = TH.d.slice();
    UI.palette = o.id; saveUI(); applyPalette(); renderPalettes(); closeThemeEditor(); toast(t("th.saved", { name: name }));
  });
  $("th-del").addEventListener("click", function () {
    if (!TH || !TH.id) return;
    UI.own = (UI.own || []).filter(function (o) { return o.id !== TH.id; });
    if (UI.palette === TH.id) UI.palette = "classic";
    saveUI(); applyPalette(); renderPalettes(); closeThemeEditor();
  });
  $("th-cancel").addEventListener("click", closeThemeEditor);
  $("th-close").addEventListener("click", closeThemeEditor);
  // close on the dark background only when the click also started there (not when dragging in a colour picker and releasing outside)
  let thDownOnBg = false;
  $("theme-modal").addEventListener("pointerdown", function (e) { thDownOnBg = e.target === $("theme-modal"); });
  $("theme-modal").addEventListener("click", function (e) { if (e.target === $("theme-modal") && thDownOnBg) closeThemeEditor(); thDownOnBg = false; });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("theme-modal").hidden) closeThemeEditor(); });
  function applyTheme() {
    const r = document.documentElement;
    if (UI.theme === "light" || UI.theme === "dark") r.setAttribute("data-theme", UI.theme);
    else if (HOST_THEME) r.setAttribute("data-theme", HOST_THEME);
    else r.removeAttribute("data-theme");
    applyPalette();
  }
  function applyColors() {
    const st = document.documentElement.style;
    COLS.forEach(function (c) {
      if (UI.off[c.k]) { st.setProperty("--u-" + c.k, "var(--ink)"); st.setProperty("--u-" + c.k + "-d", "var(--ink)"); }
      else if (UI.colors[c.k]) { st.setProperty("--u-" + c.k, UI.colors[c.k]); st.setProperty("--u-" + c.k + "-d", "color-mix(in oklab, " + UI.colors[c.k] + " 62%, white)"); }
      else { st.removeProperty("--u-" + c.k); st.removeProperty("--u-" + c.k + "-d"); }
    });
  }
  function renderSettings() {
    markNewLimit(); markPace(); markGoal(); renderPalettes(); renderAccount();
    $("set-mcauto").checked = state.settings.mcAuto !== false;
    document.querySelectorAll("[data-theme-set]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.themeSet === UI.theme)); });
    document.querySelectorAll("[data-cardbg-set]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.cardbgSet === UI.cardBg)); });
    $("set-legend").checked = UI.legend !== false;
    $("input-sec").hidden = !CHARS.length;                     // English has no special characters
    $("set-chars").checked = UI.chars !== false;
    $("set-chars-l").textContent = t("set.chars", { chars: CHARS.join(" ") });
    $("cardbg-demo").innerHTML = '<li><span class="fr">' + mark(LX.demo) + '</span><span class="de">' + esc(t("demo." + LANG)) + '</span></li>';
    renderPackInfo();
    $("cardop").value = UI.cardOp; $("cardop-val").textContent = UI.cardOp + " %";
    $("cardop").disabled = UI.cardBg === "plain"; $("cardop-row").style.opacity = UI.cardBg === "plain" ? ".45" : "";
    $("colrows").innerHTML = COLS.map(function (c) {
      const on = !UI.off[c.k];
      return '<span class="cname"><b class="t-' + c.k + '">' + esc(c.name) + "</b><small>" + esc(c.ex) + "</small></span>" +
        '<input type="color" data-col="' + c.k + '" value="' + (UI.colors[c.k] || c.def) + '" aria-label="' + esc(t("set.colorFor", { name: c.name })) + '"' + (on ? "" : " disabled") + ">" +
        '<label class="on"><input type="checkbox" data-colon="' + c.k + '"' + (on ? " checked" : "") + "> " + t("set.colorOn") + "</label>";
    }).join("");
    renderTrash();
    renderBackup();
    setScope();
  }
  let SET_FROM = "home";
  var SETTINGS_FROM_START = false;   // var: show() can run before this line
  function closeSettings() { const to = SET_FROM; if (to === "start") show("start"); else if (to === "list") show("list"); else if (to === "study" && S) { show("study"); } else show("home"); }
  // from the start screen only the general settings are shown; course settings belong to a course
  function setScope() {
    const fromStart = SET_FROM === "start";
    Array.prototype.forEach.call(document.querySelectorAll("#view-settings .set-course"), function (el) { el.hidden = fromStart || (el.id === "input-sec" && !CHARS.length); });
    $("set-course-h").textContent = fromStart ? t("set.group.courses") : t("set.group.course", { lang: STR["lang." + LANG] || LANG });
    $("set-course-note").hidden = !fromStart; $("set-course-note").textContent = t("set.group.courseNote");
  }
  $("open-settings").addEventListener("click", function () {
    if (view === "settings") { closeSettings(); return; }
    SET_FROM = view === "add" ? "home" : view; SETTINGS_FROM_START = SET_FROM === "start"; show("settings"); renderSettings(); setScope();
  });
  $("set-back").addEventListener("click", closeSettings);
  $("theme-seg").addEventListener("click", function (e) {
    const b = e.target.closest("[data-theme-set]"); if (!b) return;
    UI.theme = b.dataset.themeSet; saveUI(); applyTheme(); renderSettings();
  });
  $("colrows").addEventListener("input", function (e) {
    const k = e.target.dataset.col; if (!k) return;
    const c = COLS.filter(function (x) { return x.k === k; })[0];
    if (e.target.value.toLowerCase() === c.def) delete UI.colors[k]; else UI.colors[k] = e.target.value.toLowerCase();
    saveUI(); applyColors();
  });
  $("colrows").addEventListener("change", function (e) {
    const k = e.target.dataset.colon; if (!k) return;
    if (e.target.checked) delete UI.off[k]; else UI.off[k] = true;
    saveUI(); applyColors(); renderSettings();
  });
  document.querySelectorAll("[data-colpreset]").forEach(function (b) {
    b.addEventListener("click", function () {
      const pr = COL_PRESETS[b.dataset.colpreset];
      UI.colors = Object.assign({}, pr.colors); UI.off = Object.assign({}, pr.off);
      saveUI(); applyColors(); renderSettings();
    });
  });
  $("cardbg-seg").addEventListener("click", function (e) {
    const b = e.target.closest("[data-cardbg-set]"); if (!b) return;
    UI.cardBg = b.dataset.cardbgSet; saveUI(); applyCardBg(); renderSettings();
  });
  $("cardop").addEventListener("input", function () {
    UI.cardOp = +$("cardop").value; $("cardop-val").textContent = UI.cardOp + " %"; applyCardBg();
  });
  $("cardop").addEventListener("change", saveUI);
  $("set-legend").addEventListener("change", function () { UI.legend = $("set-legend").checked; saveUI(); });
  $("set-chars").addEventListener("change", function () { UI.chars = $("set-chars").checked; saveUI(); if (!UI.chars) $("charbar").hidden = true; });
  applyTheme();
  applyColors();
  applyCardBg();
  applyLangUI();
  $("course-btn").addEventListener("click", function () { show("start"); });
  $("courses").addEventListener("click", function (e) {
    const b = e.target.closest("[data-course]"); if (!b) return;
    if (b.dataset.course === PAIR) { show("home"); return; }
    try { sessionStorage.setItem("fiches-enter", "1"); } catch (x) {}
    switchLang(b.dataset.course);
  });

  // explanations behind a "?": the help text of a setting or panel is folded away and opens next to its heading
  (function helpify() {
    let n = 0;
    const attach = function (p, anchor, inside) {
      const id = "help-" + (++n);
      p.id = p.id || id + "-t"; p.hidden = true; p.classList.add("help-pop");
      const b = document.createElement("button");
      b.type = "button"; b.className = "qhelp"; b.textContent = "?";
      b.setAttribute("aria-expanded", "false"); b.setAttribute("aria-controls", p.id); b.setAttribute("aria-label", t("help.show"));
      b.addEventListener("click", function (e) { e.preventDefault(); const open = p.hidden; p.hidden = !open; b.setAttribute("aria-expanded", String(open)); });
      if (inside) anchor.appendChild(b); else anchor.insertAdjacentElement("afterend", b);
      (inside ? anchor : anchor.closest(".row") || anchor).insertAdjacentElement("afterend", p);   // the text opens right below its heading
    };
    // settings: every explanation paragraph without its own logic
    Array.prototype.forEach.call(document.querySelectorAll("#view-settings .set-sec > p.hint"), function (p) {
      if (p.id) return;                                   // texts with their own logic stay visible (e.g. the Lernabstände description)
      for (let el = p.previousElementSibling; el; el = el.previousElementSibling) {
        if (el.matches(".row") && el.querySelector(":scope > span[data-i18n], :scope > span[id$='-l']")) { attach(p, el.querySelector(":scope > span[data-i18n], :scope > span[id$='-l']"), false); return; }
        if (el.matches("h2, h3")) { attach(p, el, true); return; }
      }
    });
    // panels in the word list: the introduction under the heading
    Array.prototype.forEach.call(document.querySelectorAll("section.panel.io > h2 + p, #read-new-panel > h2 + p"), function (p) { if (!p.id) attach(p, p.previousElementSibling, true); });
  })();

  rebuildDeck();
  renderAISettings();
  renderHome();
  let ENTER = false; try { ENTER = sessionStorage.getItem("fiches-enter") === "1"; sessionStorage.removeItem("fiches-enter"); } catch (e) {}
  if (!ENTER) show("start");
  loadPack().catch(function () { return null; }).then(function (p) {
    usePack(p); rebuildDeck(); rerender();
    if (view === "settings") renderSettings();
    setTimeout(initSync, 0);
    if (sbOn()) setTimeout(sbSyncAll, 0);
    // a new pack version (e.g. with an app update): offer to merge own words that now exist in it (after the sync had time)
    let pv = null; try { pv = localStorage.getItem(LS + "-packver"); } catch (e) {}
    if (p && String(p.version) !== pv) {
      try { localStorage.setItem(LS + "-packver", String(p.version)); } catch (e) {}
      setTimeout(function () { if (view !== "study" && $("confirm-modal").hidden) offerMerge(); }, 3000);
    }
  });
})();
</script>

</html>
