<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>Fiches Französisch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one calm column; a dashboard of lesson groups, and a single Seyès-ruled index card ("fiche bristol") as the study surface. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --ink: #1b2130;
  --muted: #5b6477;
  --line: #d9dee7;
  --soft: #e4e8ef;
  --hl: #ffe45c;
  --hl-ink: #2a2300;
  --masc: #1f55d6;
  --fem: #d1283a;
  --verb: #0f7d57;
  --adv: #8a3fc9;
  --adj: #c25400;
  --obj: #0b7c8a;
  --rule: rgba(80, 120, 200, .10);
  --rule-strong: rgba(80, 120, 200, .20);
  --margin: rgba(220, 70, 110, .30);
  --bar-new: #dfe4ec;
  --bar-learn: #9aa8c2;
  --bar-done: #1b2130;
  --shadow: 0 1px 2px rgba(20,30,50,.06), 0 8px 24px rgba(20,30,50,.08);
  --r1: #b8434f; --r2: #b7791f; --r3: #4a5a78; --r4: #1d8a63;
  --accent: var(--ink); --on-accent: var(--bg);
  --f-display: "Young Serif", Georgia, "Times New Roman", serif;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --w-m: var(--u-m, var(--masc)); --w-f: var(--u-f, var(--fem)); --w-v: var(--u-v, var(--verb)); --w-a: var(--u-a, var(--adv)); --w-j: var(--u-j, var(--adj)); --w-o: var(--u-o, var(--obj));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11141b; --surface: #1a1f2b; --ink: #e7eaf1; --muted: #9aa3b6; --line: #2c3345; --soft: #232a39;
  --hl: #ffd93d; --hl-ink: #221c00;
  --masc: #7da3ff; --fem: #ff6e7c; --verb: #4fcf98; --adv: #c497ff; --adj: #ff9f4a; --obj: #4fd3df;
  --rule: rgba(140, 170, 255, .07); --rule-strong: rgba(140, 170, 255, .13); --margin: rgba(255, 110, 150, .25);
  --bar-new: #2a3243; --bar-learn: #5d6c8c; --bar-done: #e7eaf1;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  --r1: #e0737d; --r2: #e0a650; --r3: #93a3c4; --r4: #4fcf98;
  --w-m: var(--u-m-d, var(--masc)); --w-f: var(--u-f-d, var(--fem)); --w-v: var(--u-v-d, var(--verb)); --w-a: var(--u-a-d, var(--adv)); --w-j: var(--u-j-d, var(--adj)); --w-o: var(--u-o-d, var(--obj));
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #11141b; --surface: #1a1f2b; --ink: #e7eaf1; --muted: #9aa3b6; --line: #2c3345; --soft: #232a39;
  --hl: #ffd93d; --hl-ink: #221c00;
  --masc: #7da3ff; --fem: #ff6e7c; --verb: #4fcf98; --adv: #c497ff; --adj: #ff9f4a; --obj: #4fd3df;
  --rule: rgba(140, 170, 255, .07); --rule-strong: rgba(140, 170, 255, .13); --margin: rgba(255, 110, 150, .25);
  --bar-new: #2a3243; --bar-learn: #5d6c8c; --bar-done: #e7eaf1;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.35);
  --r1: #e0737d; --r2: #e0a650; --r3: #93a3c4; --r4: #4fcf98;
  --w-m: var(--u-m-d, var(--masc)); --w-f: var(--u-f-d, var(--fem)); --w-v: var(--u-v-d, var(--verb)); --w-a: var(--u-a-d, var(--adv)); --w-j: var(--u-j-d, var(--adj)); --w-o: var(--u-o-d, var(--obj));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.field .seg { align-self: flex-start; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.app { max-width: 980px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--masc); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

/* top bar */
.top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding-block: 18px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-family: var(--f-display); font-weight: 400; font-size: 26px; letter-spacing: -.01em; }
.brand b i { font-style: normal; background: linear-gradient(transparent 58%, var(--hl) 58%, var(--hl) 90%, transparent 90%); padding-inline: 2px; }
:root[data-theme="dark"] .brand b i { color: var(--ink); }
.brand span { color: var(--muted); font-size: 13px; }
.tabs { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 10px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 7px; font-weight: 500; color: var(--muted); }
.tabs button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
@media (max-width: 560px) { .tabs { width: 100%; } .tabs button { flex: 1 1 auto; min-width: 0; padding: 6px 5px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } }
@media (max-width: 355px) { .tabs { gap: 2px; padding: 3px; } .tabs button { padding: 6px 3px; font-size: 13px; } }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--bar-learn); }
.sync.cloud::before { background: var(--verb); }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; min-width: 0; }
.today h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; line-height: 1.15; }
.today p.sub { color: var(--muted); margin: 6px 0 2px; }
.panel.today { display: flex; flex-direction: column; }
.today .today-pool { margin: 0 0 16px; font-size: 13px; }
.today .stats { margin-bottom: 14px; }
.start-wrap { flex: 1; display: flex; min-height: 88px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.stat { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.stat.due { background: var(--hl); color: var(--hl-ink); }
.stat.due span { color: var(--hl-ink); opacity: .75; }
button.stat { font: inherit; color: inherit; text-align: left; border: 1px solid transparent; cursor: pointer; width: 100%; transition: border-color .15s, transform .15s; }
button.stat:hover { border-color: var(--line); transform: translateY(-1px); }
button.stat.due:hover { border-color: var(--hl-ink); }
button.stat:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { button.stat { transition: none; } button.stat:hover { transform: none; } }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 16px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); padding: 12px 22px; font-size: 16px; }
.btn.primary:hover { opacity: .9; }
.btn.small { padding: 6px 12px; font-size: 13px; }
label.filebtn { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; position: relative; align-self: flex-start; }
label.filebtn input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
label.filebtn:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.filerow { gap: 10px; align-items: center; flex-wrap: wrap; }
/* overview: one big start button, filters and forecast fold away, groups as rows */
.start-wrap { min-height: 0; flex: none; margin: 14px 0 10px; }
.panel.today { justify-content: flex-start; }
.startbig { width: 100%; min-height: 56px; display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font: inherit; font-size: 17px; font-weight: 600; padding: 12px 16px; cursor: pointer; }
.startbig svg { width: 22px; height: 22px; flex: none; }
.startbig:disabled { opacity: .45; cursor: default; }
.startbig:not(:disabled):hover { filter: brightness(1.15); }
.ctl-det { margin: 0 0 12px; }
.ctl-det > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 13px; color: var(--muted); padding: 6px 2px; list-style: none; min-height: 32px; }
.ctl-det > summary::-webkit-details-marker { display: none; }
.ctl-det > summary svg { width: 16px; height: 16px; flex: none; }
.ctl-det > summary::after { content: "▾"; margin-left: 2px; }
.ctl-det[open] > summary::after { content: "▴"; }
.ctl-det .controls { margin: 6px 0 4px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; }
.ctl-det .today-pool { margin: 4px 0 6px; }
details.forecast > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
details.forecast > summary::-webkit-details-marker { display: none; }
details.forecast > summary h2 { margin: 0; }
details.forecast > summary::after { content: "▾"; color: var(--muted); }
details.forecast[open] > summary { margin-bottom: 12px; }
details.forecast[open] > summary::after { content: "▴"; }
.grow-t svg { width: 17px; height: 17px; flex: none; color: var(--muted); }
.grow .gpath { font-size: 12px; color: var(--muted); }
.grow-act .gmore { color: var(--muted); }
.gtiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) 4px minmax(0, 1fr); gap: 6px; width: 100%; }
.gtile.del { grid-column: 5; }
.g-kids { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 11.5px; color: var(--muted); }
.g-kids svg { width: 12px; height: 12px; }
.grow-act .gmute { color: var(--muted); }
.grow-act .gmute[aria-pressed="true"] { color: var(--fem); border-color: color-mix(in srgb, var(--fem) 45%, var(--line)); background: color-mix(in srgb, var(--fem) 8%, var(--surface)); }
.ibtn-ph { display: inline-block; width: 36px; height: 36px; flex: none; }
.gtile.ph { border-style: dashed; background: transparent; cursor: default; opacity: .55; }
@media (max-width: 380px) { .gtiles { gap: 4px; } .gtile { font-size: 11px; padding: 7px 1px; } }
.gtile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 58px; padding: 8px 2px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 12px; line-height: 1.15; cursor: pointer; text-align: center; }
.gtile svg { width: 19px; height: 19px; flex: none; }
.gtile span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gtile:not(.ph):hover { border-color: var(--muted); background: var(--soft); }
.gtile[aria-pressed="true"], .gtile.on { border-color: var(--accent); color: var(--accent); }
.gtile.del { color: var(--fem); border-color: color-mix(in srgb, var(--fem) 45%, var(--line)); }
.gtile.del:hover { background: color-mix(in srgb, var(--fem) 10%, var(--surface)); border-color: var(--fem); }
.gcur-kids.glist { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); }
.ibtn { min-width: 36px; min-height: 36px; }
/* learning modes */
.modes { display: flex; width: 100%; margin: 14px 0 0; }
.modes button { flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; }
.modes svg { width: 16px; height: 16px; flex: none; }
.modes + .start-wrap { margin-top: 8px; }
.modes button.mode-rnd { flex: 0 0 44px; }
.modes button { min-width: 0; padding-left: 6px; padding-right: 6px; font-size: 13.5px; }
@media (max-width: 420px) { .modes button:not(.mode-rnd) svg { display: none; } }
.ring .ring-fg.zero { display: none; }
.quiz, .pairs { max-width: 640px; margin: 0 auto; }
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px 14px; box-shadow: var(--shadow); }
.q-word { display: flex; align-items: center; gap: 12px; margin: 14px 0 6px; flex-wrap: wrap; }
.q-word .q-fr { font-family: var(--f-display); font-size: 32px; }
.q-word .q-de { font-size: 24px; font-weight: 600; }
.q-ask { color: var(--muted); font-size: 13.5px; margin: 6px 0 0; }
.q-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
@media (max-width: 520px) { .q-opts { grid-template-columns: minmax(0, 1fr); } }
.q-opt { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 54px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: inherit; font-size: 16px; color: var(--ink); cursor: pointer; }
.q-opt:hover:not(:disabled) { border-color: var(--ink); }
.q-opt kbd { font: 12px var(--f-mono, monospace); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; flex: none; }
.q-opt.ok, .pr-i.ok { border-color: #1D9E75; background: color-mix(in srgb, #1D9E75 14%, var(--surface)); }
.q-opt.bad, .pr-i.bad { border-color: #E24B4A; background: color-mix(in srgb, #E24B4A 14%, var(--surface)); }
.q-opt:disabled { cursor: default; }
.q-opt:disabled:not(.ok):not(.bad) { opacity: .55; }
.q-next { display: flex; justify-content: flex-end; margin-top: 14px; }
.q-sents { margin-top: 10px; }
.q-sents .de.q-only { color: var(--ink); font-size: 15px; }
.pr-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.pr-col { display: flex; flex-direction: column; gap: 10px; }
.pr-i { min-height: 54px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: inherit; font-size: 15.5px; color: var(--ink); cursor: pointer; text-align: center; transition: background .15s, border-color .15s; }
.pr-i.sel { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.pr-i.ok { opacity: .55; cursor: default; }
@media (prefers-reduced-motion: reduce) { .pr-i { transition: none; } }
/* help behind "?" */
.qhelp { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; min-width: 20px; margin-left: 8px; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--muted); font: 700 12px/1 var(--f-body); letter-spacing: 0; text-transform: none; vertical-align: 2px; cursor: pointer; }
.qhelp:hover { color: var(--ink); border-color: var(--muted); }
.qhelp[aria-expanded="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.row > .qhelp { margin-left: -4px; }
p.help-pop { background: var(--soft); border-radius: 10px; padding: 8px 12px; margin: 6px 0 10px; font-size: 13px; color: var(--ink); }
/* reading */
.read-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.read-top .seg { flex-wrap: wrap; }
.read-acts { display: inline-flex; gap: 8px; margin-left: auto; }
.read-restore { margin-top: 10px; }
.read-bar .ibtn svg { width: 18px; height: 18px; }
.rn-filerow { float: right; margin-top: -4px; }
.read-sec { margin: 18px 0 8px; }
.read-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.read-card { display: flex; flex-direction: column; gap: 3px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.read-card:hover { border-color: var(--muted); }
.rc-t { display: flex; align-items: center; gap: 8px; }
.rc-t b { font-size: 15.5px; }
.rc-de, .rc-m { font-size: 12.5px; color: var(--muted); }
.read-new { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }
.read-new textarea, .read-new input[type=text], .read-new select { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; }
.read-new textarea { resize: vertical; }
.read-new .seg { flex-wrap: wrap; }
.read-new > .rn-mode { display: flex; flex-wrap: nowrap; align-self: stretch; max-width: 520px; }
.read-new > .rn-mode button { flex: 1 1 0; min-width: 0; white-space: normal; line-height: 1.2; min-height: 38px; padding: 6px 8px; }
.read-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.read-bar .btn { white-space: nowrap; }
.read-bar .ibtn svg { width: 18px; height: 18px; }
.read-doc { max-width: 760px; margin: 0 auto; }
.rd-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 26px; margin: 0 0 4px; }
.rd-tip { margin: 6px 0 12px; }
.rd-par { font-family: var(--f-display); font-size: 19px; line-height: 1.75; margin: 0 0 14px; }
.rd-s { cursor: pointer; border-radius: 4px; padding: 1px 0; transition: background .15s; }
.rd-s:hover { background: color-mix(in srgb, var(--hl) 35%, transparent); }
.rd-s.open { background: color-mix(in srgb, var(--hl) 70%, transparent); box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.rd-s:focus-visible, .rd-b:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.rd-trbox { display: flex; flex-direction: column; gap: 6px; background: var(--soft); border-radius: 10px; padding: 8px 10px; margin: -6px 0 16px; }
.rd-tr { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; color: var(--ink); line-height: 1.45; }
.rd-tr .speak, .rd-btr .speak { flex: none; width: 28px; height: 28px; }
.rd-tr > span { padding-top: 3px; }
.rd-chat { display: flex; flex-direction: column; gap: 10px; }
.rd-b { max-width: 82%; display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; cursor: pointer; }
.rd-b.left { align-self: flex-start; background: var(--soft); border-radius: 16px 16px 16px 4px; }
.rd-b.right { align-self: flex-end; background: color-mix(in srgb, var(--hl) 38%, var(--surface)); border-radius: 16px 16px 4px 16px; }
.rd-sp { font-size: 12px; color: var(--muted); }
.rd-bt { font-family: var(--f-display); font-size: 17.5px; line-height: 1.45; }
.rd-btr { display: flex; gap: 8px; align-items: center; justify-content: space-between; font-size: 14.5px; color: var(--muted); border-top: 1px solid var(--line); margin-top: 4px; padding-top: 5px; }
#rd-play { display: inline-flex; align-items: center; gap: 6px; }
#rd-colors[aria-pressed="false"] { opacity: .55; }
.rd-par [class^="t-"], .rd-bt [class^="t-"] { font-weight: inherit; }   /* in running text the colours are enough, no bold */
#rd-play svg { width: 15px; height: 15px; }
@media (prefers-reduced-motion: reduce) { .rd-s { transition: none; } }
/* shared groups */
.g-shared { display: inline-flex; color: var(--accent); }
.g-shared svg { width: 16px; height: 16px; }
.gsec-h .gjoin { margin-left: auto; }
.gsec-h .gjoin + .gnew { margin-left: 6px; }
.sh-body { display: flex; flex-direction: column; gap: 10px; }
.sh-body p { margin: 0; }
.sh-body .btn { display: inline-flex; align-items: center; gap: 6px; }
.sh-body .btn svg { width: 15px; height: 15px; }
.sh-codebox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sh-code { font: 600 24px var(--f-mono); letter-spacing: .12em; padding: 6px 12px; border: 1px dashed var(--line); border-radius: 10px; user-select: all; }
.sh-code-in { width: 100%; max-width: 240px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: 600 20px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; }
.sh-members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.sh-members li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; }
.sh-members .gdel { width: auto; height: auto; margin: 0; padding: 4px 10px; }
.sh-body .acct-btns .gdel { width: auto; height: auto; margin: 0; padding: 6px 12px; white-space: nowrap; }
/* account */
.acct-body { display: flex; flex-direction: column; gap: 10px; }
.acct-body p { margin: 0; }
.acct-note, .acct-st { font-size: 13.5px; color: var(--muted); }
.acct-st.acct-err { color: #A32D2D; }
.acct-btns { gap: 8px; flex-wrap: wrap; }
.acct-danger summary { font-size: 13.5px; color: var(--muted); }
.acct-danger .gdel { width: auto; height: auto; margin-top: 8px; padding: 6px 12px; }
.acct-body input[type=email], .acct-body input[type=password], .acct-body input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 16px; }
.acct-body input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.acct-tabs { display: flex; width: 100%; }
.acct-tabs button { flex: 1; }
.acct-pwrow { display: flex; gap: 8px; align-items: center; }
.acct-pwrow input { flex: 1; min-width: 0; }
.acct-pwrow .acct-eye { width: 44px; height: 44px; flex: none; }
.acct-pwrow .acct-eye[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line); }
/* checkboxes in the style of the other controls: rounded box, accent colour with a check when ticked */
input[type="checkbox"] { -webkit-appearance: none; appearance: none; position: relative; flex: none; width: 20px; height: 20px; margin: 0; padding: 0; border: 1.5px solid color-mix(in srgb, var(--ink) 35%, var(--line)); border-radius: 6px; background: var(--surface); cursor: pointer; vertical-align: -4px; transition: background .15s, border-color .15s; }
input[type="checkbox"]:hover { border-color: var(--accent); }
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after { content: ""; position: absolute; left: 5.5px; top: 1.5px; width: 5px; height: 10px; border: solid var(--on-accent); border-width: 0 2px 2px 0; transform: rotate(45deg); }
input[type="checkbox"]:indeterminate { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:indeterminate::after { content: ""; position: absolute; left: 4px; top: 7.5px; width: 9px; height: 2px; background: var(--on-accent); border-radius: 1px; }
input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="checkbox"]:disabled { opacity: .45; cursor: default; }
@media (prefers-reduced-motion: reduce) { input[type="checkbox"] { transition: none; } }
label.row:has(> input[type="checkbox"]) { flex-wrap: nowrap; align-items: flex-start; gap: 10px; }
label.row > input[type="checkbox"] { margin-top: 1px; }
label.row > input[type="checkbox"] + span { flex: 1; min-width: 0; }
.ms-pop input[type="checkbox"], .pitem input[type="checkbox"] { width: 18px; height: 18px; }
.ms-pop input[type="checkbox"]:checked::after, .pitem input[type="checkbox"]:checked::after { left: 4.5px; top: 1px; }
#confirm-modal { z-index: 30; }   /* questions open above other dialogs (e.g. sharing) */
/* colour themes */
.set-sub { font-size: 14px; font-weight: 600; margin: 16px 0 8px; }
.pal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.pal { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); font: inherit; font-size: 13.5px; color: var(--ink); cursor: pointer; text-align: left; }
.pal[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.pal-sw { display: flex; }
.pal-sw i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--surface); margin-left: -6px; box-shadow: 0 0 0 1px var(--line); }
.pal-sw i:first-child { margin-left: 0; }
.pal-sw .cl-bg { background: #eef1f5; } .pal-sw .cl-ink { background: #1b2130; } .pal-sw .cl-hl { background: #ffe45c; }
:root[data-theme="dark"] .pal-sw .cl-bg { background: #11141b; } :root[data-theme="dark"] .pal-sw .cl-ink { background: #e7eaf1; }
/* own themes */
.pal-own { position: relative; display: flex; }
.pal-own .pal { flex: 1; padding-right: 34px; }
.pal-edit { position: absolute; top: 6px; right: 6px; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--muted); padding: 0; cursor: pointer; }
.pal-edit svg { width: 15px; height: 15px; }
.pal-new { border-style: dashed; color: var(--muted); }
.pal-plus { display: inline-flex; width: 22px; height: 22px; align-items: center; justify-content: center; }
.pal-plus svg { width: 18px; height: 18px; }
.th-fields { display: flex; flex-direction: column; gap: 6px; }
.th-f { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.th-f input[type=color] { width: 40px; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--surface); flex: none; cursor: pointer; }
.th-f span { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.th-f small { color: var(--muted); font-size: 12px; }
.th-f code { font: 12px var(--f-mono); color: var(--muted); }
.th-w { margin: 0 0 4px; font-size: 13px; color: #A32D2D; }
.th-prev { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; background: var(--p-bg); border-radius: 12px; padding: 12px; border: 1px solid var(--line); }
.tp-panel, .tp-card { background: var(--p-sf); border: 1px solid var(--p-li); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; color: var(--p-ink); min-width: 0; }
.tp-h { font-family: var(--f-display); font-weight: 400; font-size: 17px; }
.tp-sub, .tp-mu { color: var(--p-mu); font-size: 12px; }
.tp-btn { background: var(--p-ac); color: var(--p-on); border-radius: 8px; padding: 6px 8px; font-weight: 600; font-size: 13px; text-align: center; }
.tp-row { display: flex; gap: 6px; }
.tp-row > span { flex: 1; border-radius: 6px; padding: 4px 6px; font: 600 14px var(--f-mono); display: flex; flex-direction: column; }
.tp-row small { font: 11px var(--f-body); opacity: .8; }
.tp-due { background: var(--p-hl); color: var(--p-hli); }
.tp-st { background: var(--p-so); }
.tp-w { font-family: var(--f-display); font-size: 16px; line-height: 1.35; }
.th-code textarea { width: 100%; font: 12px var(--f-mono); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); color: var(--ink); margin: 6px 0; resize: vertical; }
.th-code summary { cursor: pointer; font-size: 14px; font-weight: 600; }
/* points chart */
.kp-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.kp-now { font-size: 14px; color: var(--muted); }

.kp-legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted); }

/* progress dialog */

.lv-bars { display: flex; flex-direction: column; gap: 9px; }

.lb-m, .kl-m { background: var(--accent); }

.kl-h { background: #EF9F27; }
.lv-n { text-align: right; color: var(--muted); font-size: 12.5px; white-space: nowrap; }

.lv-n small { display: block; font-size: 11.5px; }
.lv-fold > summary { list-style: none; cursor: pointer; }

.lv-fold[open] > summary .lv-k::before { content: "▾ "; }
.lv-kids { display: flex; flex-direction: column; gap: 9px; margin: 9px 0 0 14px; padding-left: 10px; border-left: 2px solid var(--line); }
.lv-sub .lv-k { font-weight: 500; }
.kp-grid { stroke: var(--line); stroke-width: 1; }
.hl-l { fill: none; stroke: color-mix(in srgb, var(--accent) 45%, var(--soft)); stroke-width: 3; stroke-linejoin: round; }
.hl-m { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linejoin: round; }
.hd-l { fill: color-mix(in srgb, var(--accent) 45%, var(--soft)); } .hd-m { fill: var(--accent); }
.q-k { fill: var(--accent); } .q-h { fill: #EF9F27; } .q-f { fill: var(--fem); opacity: .75; } .q-none { fill: var(--line); }
/* motivation */
.motiv { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
.ring { width: 64px; height: 64px; flex: none; }

.ring text { font: 600 13px var(--f-mono, monospace); fill: var(--ink); }
.motiv-t { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.motiv-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 3px 10px; font: inherit; font-size: 12.5px; border: 0; }
.pill svg { width: 14px; height: 14px; }

.kp-d { font-size: 11.5px; margin-left: 2px; }

.kp-d.down { color: #A32D2D; }

.done-sum { margin: 4px 0 14px; }
.ds-tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
.ds-tiles div { background: var(--soft); border-radius: 10px; padding: 8px 10px; text-align: center; }
.ds-tiles b { display: block; font-size: 20px; font-family: var(--f-mono, monospace); }
.ds-tiles span { font-size: 12px; color: var(--muted); }
.ds-line { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; animation: dspop .35s ease both; }
.ds-line svg { width: 22px; height: 22px; flex: none; color: #BA7517; }
.ds-line div { display: flex; flex-direction: column; }
.ds-line span { font-size: 12.5px; color: var(--muted); }
@keyframes dspop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ds-line { animation: none; } .ring .ring-fg { transition: none; } }
.panel.today .stats { margin: 0; gap: 6px; }
.today .stat { padding: 7px 9px; }
.today .stat b { font-size: 17px; }
.today .stat span { font-size: 11.5px; line-height: 1.25; display: block; }
@media (max-width: 560px) { .panel.today .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } .startbig { font-size: 16px; } }
.pace-t { min-width: 0; width: auto; }

.gt-ex { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-left: 3px solid var(--line); padding: 4px 0 4px 10px; margin: 8px 0; }

.gt-warn { background: var(--soft); border-radius: 10px; padding: 8px 12px; margin: 12px 0 6px; font-size: 14px; }
.gt-warn ul { margin: 4px 0 0; padding-left: 18px; }
.gt-see { font-size: 14px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; color: var(--ink); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.gram-box { max-width: 640px; width: 100%; }

.gram-bar h2 { margin: 0; }
.gram-bar { display: flex; justify-content: space-between; margin-bottom: 8px; }

.btn.ghost { background: transparent; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.bars { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 120px; }
.bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }

.fc-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }

.act { display: grid; grid-template-columns: repeat(14, minmax(0, 1fr)); gap: 3px; margin-top: 12px; }
.act i { display: block; aspect-ratio: 1; max-height: 18px; border-radius: 4px; background: var(--soft); }

.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-family: var(--f-mono); font-size: 13px; font-weight: 600; }

select { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; margin-bottom: 22px; color: var(--muted); }

.gsearch { position: relative; margin-bottom: 14px; }

.gsearch input { width: 100%; padding: 10px 12px 10px 38px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); font: inherit; font-size: 15px; }
.gsec { margin-bottom: 18px; }
.gsec-h .gnew { margin-left: auto; width: 36px; height: 36px; }
.gsec-h .gnew svg { width: 18px; height: 18px; }
.gsec-h h3 { display: flex; align-items: center; gap: 6px; min-width: 0; }
.gcrumb { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; color: var(--muted); margin: -4px 0 10px; }
.gcrumb button { border: 0; background: none; padding: 2px 0; color: var(--muted); font: inherit; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.gcrumb b { color: var(--ink); font-weight: 600; }
.gopen { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.gopen svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.gopen span { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.gsec-h { display: flex; align-items: center; gap: 8px; width: 100%; margin: 0 0 10px; padding: 0; border: 0; background: none; color: var(--ink); font: inherit; text-align: left; }
.gsec-h h3 { font-size: 15px; font-weight: 600; margin: 0; }
.gsec-h .cnt { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.gsec-h .cnt .badge-due { margin-left: 4px; }
button.gsec-h { cursor: pointer; padding: 6px 0; }
.gsec-h .chev { width: 18px; height: 18px; flex: none; color: var(--muted); transition: transform .2s; }
.gsec-h[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.gsec-empty { font-size: 13px; color: var(--muted); margin: 0; }
.glist { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; align-items: start; }
@media (max-width: 400px) { .glist { grid-template-columns: 1fr; } }
.grow { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 8px 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 8px; min-width: 0; }
.grow.muted { background: color-mix(in srgb, var(--surface) 60%, transparent); border-style: dashed; }
.grow.muted .grow-main { opacity: .6; }
.grow-main { display: flex; flex-direction: column; gap: 5px; min-width: 0; padding: 2px 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.grow-t { display: flex; align-items: center; gap: 6px; min-width: 0; }
.grow-t b { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow-t .lv { flex: none; }
.grow-m { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

.grow-act { display: flex; gap: 6px; }

.grow-act .ibtn svg { width: 19px; height: 19px; }
.grow-act .ibtn[data-mute][aria-pressed="true"] { color: var(--fem); background: color-mix(in srgb, var(--fem) 12%, var(--surface)); border-color: color-mix(in srgb, var(--fem) 45%, var(--line)); }
.grow-more { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 2px; }
.grow-more p { flex: 1 1 100%; margin: 0 0 4px; font-size: 13px; color: var(--muted); }
.grow-more .ibtn { width: 36px; height: 36px; }
.gdel { flex: none; width: 28px; height: 28px; margin: -6px -6px 0 0; border: 1px solid transparent; border-radius: 8px; background: none; color: var(--fem); font-size: 15px; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; opacity: .75; }
.gdel:hover, .gdel:focus-visible { opacity: 1; border-color: var(--fem); background: color-mix(in srgb, var(--fem) 10%, transparent); }
.lv { font-family: var(--f-mono); font-size: 11px; font-weight: 600; border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; color: var(--muted); }
.meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--bar-new); }
.meter i { display: block; height: 100%; }
.meter .m-done { background: var(--bar-done); }
.meter .m-learn { background: var(--bar-learn); }
.seg button.seg-ic { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; }
.seg-ic svg { width: 15px; height: 15px; }
.ibtn:disabled { opacity: .4; cursor: default; }
.groups-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.groups-h .section-h { margin-bottom: 0; }
.groups-tools { display: flex; gap: 6px; }
.groups-tools .ibtn { width: 36px; height: 36px; }
.groups-tools .ibtn svg { width: 18px; height: 18px; }
.muted-tag { display: inline-block; font-size: 11px; font-weight: 600; color: var(--fem); margin-left: 4px; }
.badge-due { background: var(--hl); color: var(--hl-ink); border-radius: 6px; padding: 1px 7px; font-weight: 600; font-size: 12px; }

.danger-zone { margin-top: 28px; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 13px; color: var(--muted); }

/* colours for word classes */
.t-m, .g-m { color: var(--w-m); font-weight: 600; }
.t-f, .g-f { color: var(--w-f); font-weight: 600; }
.t-v, .p-v { color: var(--w-v); font-weight: 600; }
.t-a, .p-a { color: var(--w-a); font-weight: 600; font-style: italic; }
.t-j, .p-j { color: var(--w-j); font-weight: 600; }
.t-o { color: var(--w-o); font-weight: 600; text-decoration: underline dotted; text-underline-offset: 3px; }
.t-p { color: var(--w-v); font-weight: 600; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
/* articles stay neutral unless "Artikel einfärben" is on */
.t-m .art, .t-f .art, .g-m .art, .g-f .art { color: var(--ink); font-weight: 400; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* study */
.study-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.study-bar .ttl { font-weight: 600; }
.study-bar .cnt { margin-left: auto; font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.progress { height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; margin-bottom: 22px; }
.progress i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

.stage { max-width: 680px; margin: 0 auto; perspective: 1600px; }
.card { display: grid; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.3,.7,.2,1); cursor: pointer; border-radius: 16px; }
.card.flipped { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; background-color: var(--surface); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line);
  position: relative; isolation: isolate;
  padding: 22px 24px 22px 62px; min-height: 340px; display: flex; flex-direction: column; min-width: 0; }
/* ruled "fiche bristol" background on its own layer, so its opacity can be set in the settings */
.face::before { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1; pointer-events: none; opacity: var(--card-lines, 1);
  background-image:
    linear-gradient(to right, transparent 44px, var(--margin) 44px, var(--margin) 45px, transparent 45px),
    repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule-strong) 31px 32px),
    repeating-linear-gradient(to bottom, transparent 0 7px, var(--rule) 7px 8px); }
:root[data-cardbg="plain"] .face::before { display: none; }
:root[data-cardbg="plain"] .face { padding-left: 24px; }
.back { transform: rotateY(180deg); }
/* only the visible face may receive taps – some mobile browsers/WebViews hit-test the hidden face too */
.card:not(.flipped) > .face.back, .card.flipped > .face.front { pointer-events: none; }
.card:not(.flipped) > .face.front, .card.flipped > .face.back { z-index: 2; }
/* the hidden face is also made invisible at the middle of the turn (90°) – some browsers (Firefox) briefly show it mirrored */
.front { transform: rotateY(0deg); }
.face { transition: visibility 0s linear 90ms; }
.card.flipped > .face.front, .card:not(.flipped) > .face.back { visibility: hidden; }
.eyebrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.eyebrow .pos { text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.front .word-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; padding-block: 24px; }
.big { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 6vw, 46px); line-height: 1.12; overflow-wrap: anywhere; }
.big .g-m, .big .g-f, .big .p-v, .big .p-a, .big .p-j { font-weight: 400; }
.big .art { font-weight: 400 !important; }
.hint { font-size: 13px; color: var(--muted); }
.editcard { margin-left: auto; padding: 3px 10px; font-size: 12px; }
.back .head { display: flex; flex-direction: column; gap: 4px; padding-block: 14px 12px; }
.back .from { color: var(--muted); font-size: 14px; }
.back .tagline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.gtag { font-family: var(--f-mono); font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 7px; border: 1px solid currentColor; }
.speak { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; touch-action: manipulation; cursor: pointer; position: relative; z-index: 3; display: inline-grid; place-items: center; padding: 0; color: var(--muted); flex: none; }
.speak:hover { color: var(--ink); border-color: var(--muted); }
.speak svg { width: 17px; height: 17px; pointer-events: none; }
.speak.speaking { color: var(--ink); border-color: var(--ink); background: var(--soft); }
.sents { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14px; border-top: 1px dashed var(--line); padding-top: 14px; }
.sents li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: start; }
.sents .fr { font-size: 17px; line-height: 1.45; }
.sents .de { grid-column: 1; color: var(--muted); font-size: 14px; }

.actions { max-width: 680px; margin: 18px auto 0; }
.reveal { width: 100%; padding: 14px; font-size: 16px; }
.kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); margin-left: 6px; }
.rate { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.rate button { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px 9px; display: flex; flex-direction: column; align-items: center; gap: 2px; border-top: 4px solid var(--c); }
.rate button:hover { background: var(--soft); }
.rate b { font-size: 15px; }
.rate small { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate.rate-new { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rate .rn-go { --c: var(--ink); } .rate .rn-known { --c: var(--r4); }
.rate .r0 { --c: var(--r1); } .rate .r1 { --c: var(--r2); } .rate .r2 { --c: var(--r3); } .rate .r3 { --c: var(--r4); }
.keys { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

.done { max-width: 560px; margin: 30px auto; text-align: left; }
.done h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; margin-bottom: 8px; }
.done p { color: var(--muted); margin: 0 0 16px; }
.tally { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.tally div, .tally button { background: var(--soft); border-radius: 10px; padding: 8px 10px; border: 0; border-top: 4px solid var(--c); font: inherit; color: inherit; text-align: left; }
.tally button { cursor: pointer; }
.tally button:disabled { cursor: default; opacity: .55; }
.tally button[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--c); }
.dl-hint { font-size: 13px; color: var(--muted); margin: -6px 0 4px; }
.dl-h { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 14px 0 6px; padding-left: 8px; border-left: 4px solid var(--c); }
.dl { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dl li + li { border-top: 1px solid var(--line); }
.dl button { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; width: 100%; padding: 9px 12px; background: none; border: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.dl button:hover { background: var(--soft); }
.dl .dl-t { color: var(--muted); font-size: 14px; text-align: right; }
#done-list { margin-bottom: 18px; }
.tally b { display: block; font-family: var(--f-mono); font-size: 20px; }
.tally span { font-size: 12px; color: var(--muted); }

/* list */
.list-tools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.list-tools input { font: inherit; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); flex: 1 1 220px; min-width: 0; }
.ms { position: relative; }
.ms-btn { font: inherit; font-size: 13px; padding: 8px 30px 8px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; text-align: left; }
.ms-btn::after { content: ""; position: absolute; right: 12px; top: 50%; width: 6px; height: 6px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); }
.ms-btn.active { border-color: var(--ink); font-weight: 600; }
.ms-pop { position: absolute; z-index: 15; top: calc(100% + 4px); left: 0; min-width: 220px; max-width: min(320px, calc(100vw - 32px)); max-height: 360px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 6px; }
.ms-pop label { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; font-size: 14px; cursor: pointer; }
.ms-pop label:hover { background: var(--soft); }
.ms-pop label { justify-content: flex-start; text-align: left; width: 100%; margin: 0; }
.ms-pop input[type="checkbox"] { width: 16px; height: 16px; margin: 0; padding: 0; flex: none; }
.ms-pop .ms-all { border-bottom: 1px solid var(--line); margin-bottom: 4px; border-radius: 8px 8px 0 0; font-weight: 600; }
.ms-pop .ms-n { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
#ms-group .ms-pop { min-width: 280px; max-height: 420px; }
.gpick { width: 100%; }
.gpick .ms-btn { width: 100%; max-width: 100%; text-align: left; padding-top: 10px; padding-bottom: 10px; font-size: 14px; }
.gpick .ms-pop { min-width: 280px; width: 100%; max-height: 380px; }
.ms-pop .gp-leaf, .ms-pop .gp-parent { display: block; width: 100%; text-align: left; background: none; border: 0; font: inherit; font-size: 14px; color: inherit; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.ms-pop .gp-leaf { padding-left: calc(var(--d) * 18px + 26px); }
.ms-pop .gp-leaf.base { padding-left: 8px; }
.ms-pop .gp-leaf:hover, .ms-pop .gp-parent:hover { background: var(--soft); }
.ms-pop .gp-leaf.on { background: var(--soft); font-weight: 600; box-shadow: inset 3px 0 0 var(--ink); }
.ms-pop .gp-parent { font-weight: 600; padding-left: 2px; flex: 1; }
.ms-pop .gp-new { color: var(--ink); font-weight: 600; padding-left: 8px; }
.ms-pop .ms-q { display: block; width: 100%; box-sizing: border-box; margin: 2px 0 6px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 14px; background: var(--surface); color: var(--ink); }
.ms-pop .ms-sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 8px 4px; }
.ms-pop .ms-sec.sep { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.ms-pop .ms-node { display: flex; align-items: center; padding-left: calc(var(--d) * 18px); }
.ms-pop .ms-node label { flex: 1; padding-left: 2px; font-weight: 600; }
.ms-pop .ms-tog { width: 24px; height: 30px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0; flex: none; }
.ms-pop label.ms-leaf { padding-left: calc(var(--d) * 18px + 26px); }
.ms-pop label.ms-leaf.base { padding-left: 8px; }
.ms-pop .ms-empty { color: var(--muted); font-size: 13px; padding: 6px 8px; margin: 0; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: 14px; }
th, td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; background: var(--soft); }
tr:last-child td { border-bottom: 0; }
td.st { font-family: var(--f-mono); font-size: 12px; white-space: nowrap; color: var(--muted); }
td.st.due { color: var(--hl-ink); }
td.st.due span { background: var(--hl); border-radius: 5px; padding: 1px 6px; }
.count-note { font-size: 13px; color: var(--muted); margin: 10px 2px 0; }

/* export / import */
.io-bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.io-bar .hint { margin-left: auto; }
.io-bar .ibtn { width: 40px; height: 40px; }
.io-bar .ibtn svg { width: 19px; height: 19px; }
.aip-steps { margin: 0 0 10px; padding-left: 20px; }
.aip-steps li { margin: 2px 0; }
#aip-text { min-height: 220px; }
#imp-text { min-height: 90px; }
.imp-or { margin: 12px 0 6px; }
#add-word.addicon { width: 44px; height: 40px; border-radius: 10px; margin-right: 10px; }
#add-word.addicon svg { width: 20px; height: 20px; }
.io { margin-bottom: 16px; display: flex; flex-direction: column; gap: 12px; }
.io h2 { font-family: var(--f-display); font-weight: 400; font-size: 22px; }
.io p, .io li { margin: 0; font-size: 14px; color: var(--muted); }

<script type="text/plain" id="grammar-fr">
%fiches-grammar 1
%id fr-de
%version 1

# genre | Genus erkennen | A1 | pos:n
Jedes französische Nomen ist **männlich** oder **weiblich** – es gibt kein Neutrum. Lerne das Nomen deshalb immer mit Artikel. Viele Endungen verraten das Genus:
|^ männlich | weiblich |
| -age: le fromage, le voyage | -tion, -sion: la nation, la télévision |
| -ment: le moment, l'appartement | -té: la liberté, la santé |
| -eau: le bateau, le gâteau | -ette: la baguette, la fourchette |
| -isme: le tourisme | -ure: la voiture, la culture |
| -ier, -er: le cahier, le dîner | -ence, -ance: la science, la chance |
> Le [m:fromage] [v:est] [j:délicieux]. || Der Käse ist köstlich.
> La [f:voiture] de mon [m:père] [v:est] [j:rouge]. || Das Auto meines Vaters ist rot.
! Ausnahmen gibt es: la plage, la page, l'image (weiblich trotz -age), l'eau (weiblich).
! Das Genus aus dem Deutschen übertragen klappt oft nicht: der Tisch → la table, das Haus → la maison.
→ articles, adjectifs

# articles | Artikel: le, un, du | A1 | word:le, word:la, word:les, word:un, word:une, word:des, word:du
|^ | männlich | weiblich | Plural |
| bestimmt | le (l' vor Vokal) | la (l') | les |
| unbestimmt | un | une | des |
| Teilungsartikel | du (de l') | de la (de l') | des |
Der **Teilungsartikel** steht bei unzählbaren Mengen: Brot, Wasser, Mut. Nach Mengenangaben und nach einer Verneinung wird daraus nur **de** (d').
> Je [v:mange] du [m:pain] et je [v:bois] de l'[f:eau]. || Ich esse Brot und trinke Wasser.
> Je [v:n'ai] [a:pas] de [f:voiture]. || Ich habe kein Auto.
> Un [m:kilo] de [f:pommes], s'il vous plaît. || Ein Kilo Äpfel, bitte.
! Nach Verben des Mögens bleibt der bestimmte Artikel: J'aime le café (nicht: du café).
! à + le = au, à + les = aux, de + le = du, de + les = des.
→ genre, negation

# negation | Verneinung: ne … pas | A1 | word:ne, word:pas, word:jamais, word:rien, word:personne
Die Verneinung umschließt das konjugierte Verb: **ne** davor, **pas** (oder ein anderes Wort) danach. Vor Vokal wird ne zu n'.
| ne … pas | nicht |
| ne … jamais | nie |
| ne … plus | nicht mehr |
| ne … rien | nichts |
| ne … personne | niemand |
> Je [a:ne] [v:parle] [a:pas] [m:anglais]. || Ich spreche kein Englisch.
> Il [a:n']est [a:jamais] [j:content]. || Er ist nie zufrieden.
> Nous [a:n']avons [a:plus] de [m:pain]. || Wir haben kein Brot mehr.
! Im passé composé umschließt die Verneinung das Hilfsverb: Je n'ai pas mangé.
! In der gesprochenen Sprache fällt ne oft weg: J'sais pas. Schreiben solltest du es trotzdem.
→ articles

# present | Präsens: Verben auf -er, -ir, -re | A1 | pos:v, tense:pres
Die meisten Verben enden auf **-er** und sind regelmäßig. Man streicht die Endung und hängt an:
|^ | parler | finir | vendre |
| je | parle | finis | vends |
| tu | parles | finis | vends |
| il/elle | parle | finit | vend |
| nous | parlons | finissons | vendons |
| vous | parlez | finissez | vendez |
| ils/elles | parlent | finissent | vendent |
Die wichtigsten unregelmäßigen Verben musst du auswendig lernen: être, avoir, aller, faire, pouvoir, vouloir, savoir, venir, prendre. Die Konjugationstabelle auf den Karten zeigt sie dir.
> Nous [v:parlons] [a:souvent] [m:français]. || Wir sprechen oft Französisch.
> Ils [v:finissent] le [m:travail] à six [f:heures]. || Sie beenden die Arbeit um sechs Uhr.
! Die Endungen -e, -es, -ent werden nicht gesprochen: il parle und ils parlent klingen gleich.
! Bei -ger und -cer bleibt die Aussprache gleich: nous mangeons, nous commençons.
→ pc, reflexifs

# pc | Passé composé: avoir oder être? | A2 | etre, tense:pc
Das passé composé ist die wichtigste Vergangenheit im Gespräch: Hilfsverb **avoir** oder **être** im Präsens + Partizip (parlé, fini, vendu).
Die meisten Verben bilden es mit **avoir**. Mit **être** stehen Verben der Bewegung und Zustandsänderung – merk dir das „Haus von être“: aller, venir, arriver, partir, entrer, sortir, monter, descendre, naître, mourir, rester, tomber, retourner, devenir, revenir, rentrer – und **alle reflexiven Verben**.
Mit être richtet sich das Partizip nach dem Subjekt: elle est partie, ils sont partis.
> J'[v:ai mangé] une [f:pizza]. || Ich habe eine Pizza gegessen.
> Elle [v:est allée] au [m:cinéma]. || Sie ist ins Kino gegangen.
> Nous [o:nous] [v:sommes levés] [a:tôt]. || Wir sind früh aufgestanden.
! Deutsches „sein“ hilft nur teilweise: ich bin geblieben = je suis resté, aber ich bin gelaufen = j'ai couru.
! Die Angleichung nicht vergessen: Marie est arrivée.
→ imparfait, reflexifs

# imparfait | Imparfait oder passé composé | A2 | tense:imp, tense:pqp
Beide sind Vergangenheit, aber mit unterschiedlicher Aufgabe:
|^ imparfait | passé composé |
| Zustand, Hintergrund, Beschreibung | einzelnes, abgeschlossenes Ereignis |
| Gewohnheit: früher immer … | einmalig, zu einem Zeitpunkt |
| es war gerade … | dann passierte … |
Bildung des imparfait: Stamm der nous-Form im Präsens + -ais, -ais, -ait, -ions, -iez, -aient (nous parlons → je parlais). Einzige Ausnahme: être → j'étais.
> Il [v:pleuvait] quand je [v:suis sorti]. || Es regnete, als ich hinausging.
> [a:Avant], nous [v:allions] [a:souvent] à la [f:mer]. || Früher fuhren wir oft ans Meer.
! Signalwörter fürs imparfait: autrefois, souvent, toujours, d'habitude. Fürs passé composé: soudain, un jour, hier, tout à coup.
→ pc

# futur | Futur proche und futur simple | A2 | tense:fut
Das **futur proche** (aller + Infinitiv) ist im Alltag am häufigsten: für Pläne und nahe Zukunft. Das **futur simple** klingt etwas förmlicher und steht für Vorhersagen und Versprechen.
Futur simple: Infinitiv + -ai, -as, -a, -ons, -ez, -ont (je parlerai, je finirai; bei -re fällt das e weg: je vendrai). Unregelmäßige Stämme: être → ser-, avoir → aur-, aller → ir-, faire → fer-, pouvoir → pourr-, venir → viendr-.
> Je [v:vais partir] [a:demain]. || Ich werde morgen abreisen.
> Un [m:jour], nous [v:habiterons] à [f:Paris]. || Eines Tages werden wir in Paris wohnen.
! Nach quand steht im Französischen das Futur, wenn es um die Zukunft geht: Quand je serai grand … (Wenn ich groß bin …).
→ si

# pronoms | Objektpronomen: le, lui, y, en | A2 | word:lui, word:leur, word:y, word:en
Objektpronomen stehen **vor dem konjugierten Verb** (bei Infinitiv: vor dem Infinitiv).
|^ direkt (wen/was) | indirekt (wem) | Ort / à + Sache | de + Sache, Menge |
| me, te, le, la, nous, vous, les | me, te, lui, nous, vous, leur | y | en |
Stehen mehrere zusammen, gilt die Reihenfolge: me/te/nous/vous → le/la/les → lui/leur → y → en.
> Je [o:le] [v:vois]. || Ich sehe ihn.
> Je [o:lui] [v:donne] le [m:livre]. || Ich gebe ihm/ihr das Buch.
> Tu [v:vas] à [f:Paris] ? – Oui, j'[o:y] [v:vais] [a:demain]. || Fährst du nach Paris? – Ja, ich fahre morgen hin.
> Tu [v:veux] du [m:café] ? – Oui, j'[o:en] [v:veux]. || Willst du Kaffee? – Ja, ich will welchen.
! lui gilt für ihm und ihr: je lui parle = ich spreche mit ihm / mit ihr.
! Im bejahten Imperativ steht das Pronomen dahinter: Donne-le-moi !
→ present

# adjectifs | Adjektive: Stellung und Angleichung | A1 | pos:adj
Adjektive richten sich in Genus und Zahl nach dem Nomen: meist **+e** für weiblich, **+s** für Plural (petit, petite, petits, petites). Besondere Formen: -eux → -euse, -if → -ive, -el → -elle, beau → belle.
Die meisten Adjektive stehen **nach** dem Nomen. Einige kurze, häufige stehen **davor** – Merkhilfe BAGS: Beauty (beau, joli), Age (jeune, vieux, nouveau), Goodness (bon, mauvais), Size (grand, petit).
> une [f:voiture] [j:rouge] || ein rotes Auto
> un [j:petit] [m:chat] [j:noir] || eine kleine schwarze Katze
> de [j:belles] [f:fleurs] || schöne Blumen
! Vor Vokal gibt es Sonderformen: un bel homme, un vieil ami, un nouvel appartement.
! Manche ändern ihre Bedeutung: un grand homme (ein großer Mann = bedeutend), un homme grand (ein großgewachsener Mann).
→ genre, adverbes

# questions | Fragen stellen | A1 | word:est-ce que, word:qu'est-ce que, word:pourquoi, word:quand, word:comment, word:où, word:qui, word:quel
Es gibt drei Möglichkeiten, vom Gesprochenen zum Förmlichen:
| Intonation | Tu viens ? |
| est-ce que | Est-ce que tu viens ? |
| Umstellung (Inversion) | Viens-tu ? |
Fragewörter stehen am Anfang: où (wo), quand (wann), comment (wie), pourquoi (warum), qui (wer), que / qu'est-ce que (was), quel/quelle (welche/r).
> [a:Où] est-ce que tu [v:habites] ? || Wo wohnst du?
> Qu'est-ce que vous [v:faites] [a:ce soir] ? || Was macht ihr heute Abend?
> [j:Quelle] [f:heure] [v:est]-il ? || Wie spät ist es?
! Bei der Inversion mit il/elle wird -t- eingeschoben, wenn das Verb auf Vokal endet: Parle-t-il français ?
! quel richtet sich nach dem Nomen: quel livre, quelle maison, quels amis.

# reflexifs | Reflexive Verben | A2 | refl
Reflexive Verben haben ein Pronomen, das sich auf das Subjekt bezieht: **se laver** – sich waschen.
| je me lave | nous nous lavons |
| tu te laves | vous vous lavez |
| il/elle se lave | ils/elles se lavent |
Viele sind im Deutschen nicht reflexiv: se lever (aufstehen), se promener (spazieren gehen), s'appeler (heißen).
> Je [o:me] [v:lève] à sept [f:heures]. || Ich stehe um sieben Uhr auf.
> Comment tu [o:t']appelles ? || Wie heißt du?
> Elle [o:s']est [v:promenée] dans le [m:parc]. || Sie ist im Park spazieren gegangen.
! Im passé composé immer mit être: je me suis levé(e).
! Mit Körperteilen steht der bestimmte Artikel: Je me lave les mains (nicht: mes mains).
→ pc

# si | Bedingungssätze mit si | A2 | word:si, tense:cond
Nach **si** (wenn, falls) steht **nie futur und nie conditionnel**. Die Zeit im si-Satz bestimmt die Zeit im Hauptsatz:
|^ | si-Satz | Hauptsatz |
| real, möglich (A2) | présent | présent / futur / impératif |
| unwahrscheinlich, irreal (B1) | imparfait | conditionnel |
| irreal in der Vergangenheit (B2) | plus-que-parfait | conditionnel passé |
> Si j'[v:ai] le [m:temps], je [v:viendrai]. || Wenn ich Zeit habe, komme ich.
> Si j'[v:avais] le [m:temps], je [v:viendrais]. || Wenn ich Zeit hätte, würde ich kommen.
> Si j'[v:avais eu] le [m:temps], je [v:serais venu]. || Wenn ich Zeit gehabt hätte, wäre ich gekommen.
! Falsch: Si j'aurais le temps … – das Deutsche „hätte“ verleitet dazu, aber nach si steht das imparfait.
! si + il wird zu s'il, si + elle bleibt: s'il pleut, si elle vient.
→ futur, imparfait

# adverbes | Adverbien: Bildung und Stellung | A2 | pos:adv
Viele Adverbien bildet man aus der weiblichen Form des Adjektivs + **-ment**: lent → lentement, heureux → heureusement. Adjektive auf -ant/-ent werden zu -amment/-emment: courant → couramment, évident → évidemment.
Das Adverb steht meist **direkt nach dem konjugierten Verb**, im passé composé zwischen Hilfsverb und Partizip.
> Il [v:parle] [a:lentement]. || Er spricht langsam.
> J'[v:ai] [a:bien] [v:dormi]. || Ich habe gut geschlafen.
> Nous [v:mangeons] [a:souvent] au [m:restaurant]. || Wir essen oft im Restaurant.
! bon (Adjektiv) – bien (Adverb): un bon repas, mais il mange bien.
! Nicht jedes deutsche Adjektiv kann im Französischen als Adverb stehen: Er fährt schnell = il roule vite.
→ adjectifs

# subjonctif | Wann der Subjonctif nötig ist | B1 | tense:subj, word:que
Der subjonctif steht in Nebensätzen mit **que** nach Ausdrücken von Wunsch, Gefühl, Notwendigkeit und Zweifel – also immer, wenn etwas nicht als Tatsache gilt.
| Wunsch | je veux que, j'aimerais que |
| Gefühl | je suis content que, j'ai peur que |
| Notwendigkeit | il faut que |
| Zweifel | je doute que, je ne pense pas que |
| nach Konjunktionen | pour que, avant que, bien que |
Bildung: Stamm der ils-Form im Präsens + -e, -es, -e, -ions, -iez, -ent (ils parlent → que je parle). Wichtige Ausnahmen: être (que je sois), avoir (que j'aie), aller (que j'aille), faire (que je fasse).
> Il [v:faut] que tu [v:viennes]. || Du musst kommen.
> Je [v:veux] que vous [v:soyez] [j:heureux]. || Ich will, dass ihr glücklich seid.
! Nach je pense que / je crois que (bejaht) steht der Indikativ: Je pense qu'il vient.
! Bei gleichem Subjekt Infinitiv statt que: Je veux partir (nicht: je veux que je parte).

<script type="text/plain" id="grammar-es">
%fiches-grammar 1
%id es-de
%version 1

# genero | Genus und Artikel | A1 | pos:n, word:el, word:la, word:los, word:las, word:un, word:una
Spanische Nomen sind **männlich** oder **weiblich**. Die Endung hilft fast immer:
|^ männlich | weiblich |
| -o: el libro, el perro | -a: la casa, la mesa |
| -or: el color, el amor | -ción, -sión: la canción, la televisión |
| -aje: el viaje | -dad, -tad: la ciudad, la libertad |
| -ma (griechisch): el problema, el tema | -umbre: la costumbre |
Die Artikel:
|^ | bestimmt | unbestimmt |
| männlich | el / los | un / unos |
| weiblich | la / las | una / unas |
> El [m:libro] [v:está] en la [f:mesa]. || Das Buch liegt auf dem Tisch.
> La [f:canción] [v:es] [j:bonita]. || Das Lied ist schön.
! Ausnahmen: la mano, la foto, la moto (weiblich), el día, el mapa, el sofá (männlich).
! Weibliche Wörter mit betontem a- bekommen im Singular el: el agua, el águila – bleiben aber weiblich: el agua fría.
! a + el = al, de + el = del.
→ adjetivos

# ser-estar | ser oder estar | A1 | word:ser, word:estar
Beide heißen „sein“ – aber mit klarer Aufgabenteilung:
|^ ser | estar |
| Identität, Herkunft, Beruf | Ort, wo sich etwas befindet |
| Eigenschaften, Charakter | Zustand, Gefühl, Befinden |
| Uhrzeit, Datum, Material | Ergebnis einer Veränderung |
| ¿Qué es? ¿De dónde es? | ¿Dónde está? ¿Cómo está? |
> [v:Soy] de [f:Alemania] y [v:soy] [m:profesor]. || Ich komme aus Deutschland und bin Lehrer.
> [v:Estoy] [j:cansado] y [v:estoy] en [f:casa]. || Ich bin müde und bin zu Hause.
> La [f:fiesta] [v:es] en mi [f:casa]. || Das Fest findet bei mir zu Hause statt.
! Einige Adjektive ändern die Bedeutung: ser listo (klug) – estar listo (fertig), ser aburrido (langweilig) – estar aburrido (gelangweilt).
! Veranstaltungen (Ort eines Ereignisses) stehen mit ser: La reunión es en la oficina.

# presente | Präsens: regelmäßig und mit Stammwechsel | A1 | pos:v, tense:pres
Die Verben enden auf **-ar, -er, -ir**. Endung weg, neue Endung dran:
|^ | hablar | comer | vivir |
| yo | hablo | como | vivo |
| tú | hablas | comes | vives |
| él/ella/usted | habla | come | vive |
| nosotros | hablamos | comemos | vivimos |
| vosotros | habláis | coméis | vivís |
| ellos/ustedes | hablan | comen | viven |
Viele häufige Verben ändern im Stamm den Vokal, wenn er betont ist – außer bei nosotros und vosotros: **e → ie** (querer → quiero), **o → ue** (poder → puedo), **e → i** (pedir → pido).
> [v:Hablo] [a:un poco] de [m:español]. || Ich spreche ein bisschen Spanisch.
> ¿[v:Puedes] [v:ayudar][o:me]? || Kannst du mir helfen?
! Das Subjektpronomen fällt meist weg: hablo = ich spreche. Es steht nur zur Betonung.
! Unregelmäßige yo-Formen: tengo, hago, pongo, salgo, digo, vengo, sé, doy, voy, soy, estoy.
→ pasado, reflexivos

# gustar | gustar und ähnliche Verben | A1 | word:gustar, word:encantar, word:interesar, word:doler, word:molestar, word:faltar
Bei gustar ist das, was gefällt, das **Subjekt** – die Person steht als indirektes Objekt davor: wörtlich „mir gefällt“.
| (a mí) me gusta | (a nosotros) nos gusta |
| (a ti) te gusta | (a vosotros) os gusta |
| (a él/ella/usted) le gusta | (a ellos/ustedes) les gusta |
**gusta** bei einem Ding oder einem Verb, **gustan** bei mehreren Dingen. Genauso: encantar (sehr gefallen), interesar, doler (wehtun), molestar (stören), faltar (fehlen).
> [o:Me] [v:gusta] el [m:chocolate]. || Ich mag Schokolade.
> [o:Me] [v:gustan] los [m:perros]. || Ich mag Hunde.
> [o:Me] [v:duele] la [f:cabeza]. || Mir tut der Kopf weh.
! Falsch: Yo gusto el chocolate. Richtig: Me gusta el chocolate.
! Mit Verben immer Singular: Me gusta bailar y cantar.

# pasado | Indefinido oder imperfecto | A2 | tense:ind, tense:imp, tense:pp, tense:pqp
Das **indefinido** erzählt abgeschlossene Ereignisse, das **imperfecto** beschreibt Hintergrund und Gewohnheiten. Das **pretérito perfecto** (he hablado) steht in Spanien für Vergangenes mit Bezug zum Heute.
|^ imperfecto | indefinido | perfecto |
| Hintergrund, Beschreibung | einzelnes Ereignis | heute, diese Woche, schon |
| Gewohnheit: siempre, antes | ayer, el año pasado, en 2010 | hoy, ya, todavía no |
| hablaba, comía | hablé, comí | he hablado, he comido |
> [a:Ayer] [v:fui] al [m:cine]. || Gestern ging ich ins Kino.
> De [m:niño], [v:jugaba] [a:siempre] en la [f:calle]. || Als Kind spielte ich immer auf der Straße.
> [a:Hoy] [v:he comido] [a:demasiado]. || Heute habe ich zu viel gegessen.
! Unregelmäßige Indefinido-Stämme: tuve, estuve, hice, pude, puse, quise, vine, dije; ser und ir: fui.
! In Lateinamerika steht oft das indefinido, wo man in Spanien das perfecto nimmt.

# porpara | por oder para | A2 | word:por, word:para
|^ para – Ziel | por – Grund, Weg, Austausch |
| Zweck: um … zu | Ursache: wegen |
| Empfänger: für jemanden | durch, entlang: por la calle |
| Richtung: para Madrid | Austausch, Preis: por 10 euros |
| Frist: para el lunes | Dauer, Tageszeit: por la mañana |
> [v:Estudio] para [v:aprobar] el [m:examen]. || Ich lerne, um die Prüfung zu bestehen.
> [a:Gracias] por tu [f:ayuda]. || Danke für deine Hilfe.
> [v:Paseamos] por el [m:parque]. || Wir gehen im Park spazieren.
> Este [m:regalo] [v:es] para [o:ti]. || Dieses Geschenk ist für dich.
! Merkhilfe: para schaut nach vorn (Ziel), por schaut zurück (Grund).
! gracias por, por favor, por eso, por fin, por ejemplo – feste Ausdrücke mit por.

# reflexivos | Reflexive Verben | A2 | refl
Reflexive Verben erkennt man am **-se** im Infinitiv: levantarse (aufstehen), llamarse (heißen).
| me levanto | nos levantamos |
| te levantas | os levantáis |
| se levanta | se levantan |
Das Pronomen steht vor dem konjugierten Verb – oder hängt am Infinitiv, Gerundium und bejahten Imperativ.
> [o:Me] [v:levanto] a las siete. || Ich stehe um sieben Uhr auf.
> ¿Cómo [o:te] [v:llamas]? || Wie heißt du?
> [v:Tengo] que [v:duchar][o:me]. || Ich muss duschen.
! Mit Körperteilen steht der Artikel: Me lavo las manos (nicht: mis manos).
! Manche Verben ändern ihre Bedeutung: ir (gehen) – irse (weggehen), dormir (schlafen) – dormirse (einschlafen).
→ presente, pronombres

# pronombres | Objektpronomen | A2 | word:lo, word:le, word:les, word:se
|^ direkt (wen/was) | indirekt (wem) |
| me, te, lo/la, nos, os, los/las | me, te, le, nos, os, les |
Das Pronomen steht **vor dem konjugierten Verb** oder hängt am Infinitiv bzw. Gerundium. Bei zwei Pronomen: indirekt vor direkt – und **le/les wird vor lo/la/los/las zu se**.
> [o:Lo] [v:veo]. || Ich sehe ihn.
> [o:Le] [v:doy] el [m:libro]. || Ich gebe ihm/ihr das Buch.
> [o:Se] [o:lo] [v:doy]. || Ich gebe es ihm/ihr.
> [v:Quiero] [v:comprar][o:la]. || Ich will sie kaufen.
! Falsch: Le lo doy. Richtig: Se lo doy.
! Bei bejahtem Imperativ wird angehängt (oft mit Akzent): ¡Dámelo!
→ reflexivos

# futuro | Zukunft: ir a + Infinitiv und futuro simple | A2 | tense:fut, word:ir
Im Alltag spricht man über Pläne meist mit **ir a + Infinitiv**. Das **futuro simple** steht für Vorhersagen, Versprechen – und für Vermutungen in der Gegenwart.
Futuro simple: Infinitiv + -é, -ás, -á, -emos, -éis, -án (hablaré, comeré). Unregelmäßig: tendré, haré, podré, pondré, saldré, vendré, diré, querré, sabré.
> [v:Voy a viajar] a [f:México]. || Ich werde nach Mexiko reisen.
> [a:Mañana] [v:lloverá]. || Morgen wird es regnen.
> ¿Qué [f:hora] [v:será]? || Wie spät mag es wohl sein?
! Nach cuando steht für die Zukunft der subjuntivo, nicht das Futur: Cuando llegues, llámame.
→ subjuntivo, si

# subjuntivo | Wann der Subjuntivo nötig ist | B1 | tense:subj, word:que, word:ojalá
Der subjuntivo steht nach **que**, wenn der Hauptsatz einen Wunsch, ein Gefühl, eine Aufforderung oder einen Zweifel ausdrückt – also nichts als Tatsache behauptet wird.
| Wunsch, Aufforderung | quiero que, espero que, te pido que |
| Gefühl, Bewertung | me alegra que, es importante que |
| Zweifel, Verneinung | dudo que, no creo que |
| Zukunft nach Konjunktion | cuando, hasta que, antes de que |
| feste Wörter | ojalá, para que, aunque (vielleicht) |
Bildung: yo-Form des Präsens, -o weg, „falscher“ Vokal dran: hablar → hable, comer → coma, tener (tengo) → tenga.
> [v:Quiero] que [v:vengas]. || Ich will, dass du kommst.
> [a:Ojalá] [v:haga] [m:sol] [a:mañana]. || Hoffentlich scheint morgen die Sonne.
> [v:Llámame] cuando [v:llegues]. || Ruf mich an, wenn du ankommst.
! Nach creo que / pienso que (bejaht) steht der Indikativ: Creo que viene.
! Bei gleichem Subjekt Infinitiv: Quiero ir (nicht: quiero que yo vaya).
→ si

# si | Bedingungssätze mit si | A2 | word:si, tense:si, tense:cond
Nach **si** steht **nie futuro und nie condicional**. Die Zeit im si-Satz bestimmt den Hauptsatz:
|^ | si-Satz | Hauptsatz |
| real, möglich (A2) | presente | presente / futuro / imperativo |
| irreal, Gegenwart (B1) | imperfecto de subjuntivo | condicional |
| irreal, Vergangenheit (B2) | pluscuamperfecto de subjuntivo | condicional compuesto |
> Si [v:tengo] [m:tiempo], [v:vendré]. || Wenn ich Zeit habe, komme ich.
> Si [v:tuviera] [m:tiempo], [v:vendría]. || Wenn ich Zeit hätte, würde ich kommen.
> Si [v:hubiera tenido] [m:tiempo], [v:habría venido]. || Wenn ich Zeit gehabt hätte, wäre ich gekommen.
! Falsch: Si tendría tiempo … – nach si steht der subjuntivo (tuviera).
! Der imperfecto de subjuntivo hat zwei gleichwertige Formen: tuviera / tuviese.
→ subjuntivo, futuro

# adjetivos | Adjektive: Angleichung und Stellung | A1 | pos:adj
Adjektive richten sich in Genus und Zahl nach dem Nomen: **-o/-a/-os/-as** (rojo, roja, rojos, rojas). Adjektive auf -e oder Konsonant haben nur eine Form für beide Genera: grande, azul (Plural: grandes, azules).
Meist stehen sie **nach** dem Nomen. Davor stehen nur einige häufige Adjektive – oft verkürzt: bueno → buen, malo → mal, grande → gran.
> una [f:casa] [j:blanca] || ein weißes Haus
> un [j:buen] [m:amigo] || ein guter Freund
> los [m:coches] [j:rojos] || die roten Autos
! gran vor dem Nomen heißt „großartig“: un gran hombre (ein großer Mann = bedeutend), un hombre grande (ein großer Mann = groß gewachsen).
→ genero, adverbios

# preguntas | Fragen und Ausrufe: ¿? ¡! | A1 | word:qué, word:cómo, word:dónde, word:cuándo, word:quién, word:cuál, word:cuánto, word:por qué
Fragen und Ausrufe haben im Spanischen **ein Zeichen am Anfang und am Ende**: ¿…? und ¡…!. Fragewörter tragen immer einen Akzent.
| qué | was | cuándo | wann |
| quién | wer | dónde | wo |
| cuál | welche/r | cómo | wie |
| cuánto | wie viel | por qué | warum |
> ¿[a:Dónde] [v:vives]? || Wo wohnst du?
> ¿Por qué no [v:vienes]? – Porque [v:estoy] [j:enfermo]. || Warum kommst du nicht? – Weil ich krank bin.
> ¡Qué [j:bonito]! || Wie schön!
! por qué (warum, getrennt mit Akzent) – porque (weil, zusammen ohne Akzent).
! Bei Ja/Nein-Fragen genügt die Intonation: ¿Tienes tiempo?

# adverbios | Adverbien auf -mente | A2 | pos:adv
Viele Adverbien bildet man aus der **weiblichen Form** des Adjektivs + **-mente**: rápido → rápidamente, fácil → fácilmente. Ein Akzent des Adjektivs bleibt erhalten.
Folgen mehrere Adverbien aufeinander, bekommt nur das letzte -mente: clara y lentamente.
> [v:Habla] [a:lentamente]. || Er spricht langsam.
> [a:Normalmente] [v:desayuno] a las ocho. || Normalerweise frühstücke ich um acht.
! bueno (Adjektiv) – bien (Adverb): un buen libro, pero cocina bien.
! Viele häufige Adverbien sind kurze Wörter ohne -mente: muy, mucho, bien, mal, ya, todavía, siempre.
→ adjetivos
